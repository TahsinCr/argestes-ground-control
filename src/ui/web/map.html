<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YKI Map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <style>
    :root {
      --bg: #1e1e1e;
      --surface: rgba(37, 37, 38, 0.96);
      --surface-alt: rgba(45, 45, 48, 0.98);
      --surface-hover: rgba(42, 45, 46, 0.98);
      --border: rgba(49, 49, 49, 0.98);
      --border-strong: rgba(63, 63, 70, 0.98);
      --text: #cccccc;
      --muted: #8b949e;
      --accent: #0e639c;
      --accent-dim: rgba(9, 71, 113, 0.88);
      --success: #6a9955;
      --warning: #cca700;
      --danger: #f44747;
      --info: #3794ff;
    }

    html, body, #map-shell, #map {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", sans-serif;
    }

    #map-shell {
      position: relative;
      isolation: isolate;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--bg);
    }

    .leaflet-control-attribution {
      display: none;
    }

    .vector-base-tiles.vector-dark {
      filter: brightness(1.42) contrast(0.98) saturate(0.78);
    }

    .vector-label-tiles.vector-dark {
      filter: brightness(1.32) contrast(1.05) saturate(0.78);
      opacity: 0.98;
    }

    .vector-base-tiles.vector-light {
      filter: brightness(0.98) contrast(0.96) saturate(0.92);
    }

    .vector-label-tiles.vector-light {
      filter: contrast(1.02) saturate(0.94);
      opacity: 0.96;
    }

    .leaflet-div-icon {
      background: transparent;
      border: none;
    }

    .leaflet-vertex-icon,
    .leaflet-div-icon.leaflet-editing-icon {
      width: 10px !important;
      height: 10px !important;
      margin-left: -5px !important;
      margin-top: -5px !important;
      border: 1px solid var(--text) !important;
      border-radius: 2px !important;
      background: var(--surface-alt) !important;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .map-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 900;
    }

    .floating-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .map-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 940;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .map-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .map-top > * {
      pointer-events: auto;
    }

    .stat-chip {
      padding: 5px 8px;
      border-radius: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--muted);
    }

    .stat-chip strong {
      color: var(--text);
      margin-left: 6px;
    }

    #transfer-chip[data-state="pending"],
    #transfer-chip[data-state="dirty"] {
      color: var(--warning);
      border-color: var(--warning);
    }

    #transfer-chip[data-state="success"] {
      color: var(--success);
      border-color: var(--success);
    }

    #transfer-chip[data-state="danger"] {
      color: var(--danger);
      border-color: var(--danger);
    }

    .layer-toggle button,
    .mission-mode-button,
    .tool-button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--muted);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .layer-toggle {
      display: inline-flex;
      gap: 0;
      overflow: hidden;
      border-radius: 4px;
    }

    .layer-toggle button {
      min-width: 82px;
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 0;
    }

    .layer-toggle button + button {
      border-left: none;
    }

    .layer-toggle button.active,
    .tool-button.active,
    .tool-button.dialog-open {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .map-top-right {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      pointer-events: auto;
    }

    .gps-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      padding: 0 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.25px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .gps-summary strong {
      color: var(--text);
    }

    .gps-summary[data-state="ready"] {
      border-color: var(--success);
      color: var(--success);
    }

    .gps-summary[data-state="waiting"] {
      border-color: var(--warning);
      color: var(--warning);
    }

    .gps-summary[data-state="offline"] {
      border-color: var(--danger);
      color: var(--danger);
    }

    .tool-dock {
      --tool-group-gap: 4px;
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 950;
      display: flex;
      align-items: center;
      gap: var(--tool-group-gap);
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
    }

    .mission-mode-toggle {
      position: relative;
      display: flex;
      align-items: center;
      padding: 5px;
      border: 1px solid var(--accent);
      border-radius: 10px;
      background:
        linear-gradient(180deg, rgba(97, 168, 255, 0.14), rgba(97, 168, 255, 0.04)),
        var(--surface);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.24),
        inset 0 0 0 1px rgba(97, 168, 255, 0.08);
    }

    .mission-mode-toggle::after {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 5px rgba(97, 168, 255, 0.8);
      pointer-events: none;
    }

    .mission-mode-button {
      width: 42px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      color: var(--accent);
    }

    .mission-mode-button[data-mode="loop"] {
      color: var(--success);
      border-color: var(--success);
      background: rgba(106, 153, 85, 0.16);
    }

    .mission-mode-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .tool-button {
      width: 34px;
      height: 34px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .tool-button.is-utility {
      border-color: var(--border-strong);
    }

    .tool-button.is-danger {
      color: var(--danger);
      border-color: rgba(244, 71, 71, 0.45);
    }

    .tool-button.is-send {
      width: auto;
      min-width: 118px;
      padding: 0 11px;
      gap: 7px;
      color: var(--success);
      background: rgba(106, 153, 85, 0.14);
      border-color: rgba(106, 153, 85, 0.62);
    }

    .tool-button:hover,
    .layer-toggle button:hover,
    .mission-mode-button:hover,
    .context-menu button:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .tool-button.is-send:hover {
      color: #f4fff2;
      background: rgba(106, 153, 85, 0.28);
      border-color: var(--success);
    }

    .tool-button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .tool-button.is-send.is-pending {
      color: var(--warning);
      border-color: var(--warning);
    }

    .tool-button.is-send.is-dirty {
      color: var(--warning);
      border-color: var(--warning);
    }

    .tool-button.is-send.is-success {
      color: var(--success);
      border-color: var(--success);
    }

    .tool-button.is-send.is-danger {
      color: var(--danger);
      border-color: var(--danger);
    }

    .tool-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-button-label {
      white-space: nowrap;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .hud-footer {
      position: absolute;
      left: 12px;
      bottom: 14px;
      pointer-events: none;
      z-index: 930;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      max-width: calc(100% - 24px);
      padding: 7px 10px;
      background: rgba(30, 30, 30, 0.88);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .hud-footer strong {
      color: var(--text);
      font-weight: 700;
    }

    .hud-footer span {
      white-space: nowrap;
    }

    .hud-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .context-menu {
      position: absolute;
      z-index: 980;
      display: none;
      min-width: 180px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
      pointer-events: auto;
    }

    .context-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .marker-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      background: rgba(11, 15, 21, 0.94);
      border: 2px solid var(--marker-color, var(--accent));
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      color: var(--marker-color, var(--accent));
    }

    .marker-icon.selected {
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 0 4px rgba(88, 166, 255, 0.18);
    }

    .marker-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .home-reference-marker {
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      background: rgba(11, 15, 21, 0.96);
      border: 2px solid #f4b942;
      border-radius: 50% 50% 50% 4px;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.5);
      color: #f4b942;
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
      transform: rotate(-45deg);
    }

    .home-reference-marker span {
      transform: rotate(45deg);
    }

    .aircraft-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: var(--aircraft-color, var(--accent));
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.55));
    }

    .aircraft-icon svg {
      width: 31px;
      height: 31px;
    }

    .aircraft-icon .airframe {
      fill: rgba(8, 12, 18, 0.22);
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    .aircraft-icon .spine,
    .aircraft-icon .wing {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .overlay-label {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      background: rgba(11, 15, 21, 0.9);
      border: 1px solid var(--label-color, var(--border));
      border-radius: 6px;
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .overlay-label.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(97, 168, 255, 0.12);
    }

    .hud-footer {
      top: 54px;
      bottom: auto;
    }

    .map-dialog {
      position: absolute;
      z-index: 990;
      display: none;
      width: min(420px, calc(100% - 36px));
      max-height: calc(100% - 96px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      pointer-events: auto;
    }

    .map-dialog.small {
      width: 300px;
    }

    .map-dialog header,
    .map-dialog footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
    }

    .map-dialog footer {
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      border-bottom: none;
    }

    .map-dialog h3 {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.3px;
      flex: 1;
    }

    .map-dialog .dialog-body {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .map-dialog label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .map-dialog input,
    .map-dialog select {
      min-height: 28px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 8px;
    }

    .map-dialog button {
      min-height: 28px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .map-dialog button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .map-dialog button.danger {
      color: var(--danger);
      border-color: rgba(244, 71, 71, 0.55);
    }

    .point-list {
      display: grid;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .point-list::-webkit-scrollbar,
    .map-dialog::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    .point-list::-webkit-scrollbar-track,
    .map-dialog::-webkit-scrollbar-track {
      background: transparent;
    }

    .point-list::-webkit-scrollbar-thumb,
    .map-dialog::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border: 2px solid var(--surface);
      border-radius: 999px;
    }

    .point-list::-webkit-scrollbar-thumb:hover,
    .map-dialog::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .point-list-row {
      display: grid;
      grid-template-columns: 24px 26px minmax(98px, 1fr) 64px 64px;
      gap: 6px;
      align-items: center;
      padding: 6px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: border-color 100ms ease, background 100ms ease, opacity 100ms ease;
    }

    .point-list-row:hover {
      border-color: var(--accent);
      background: rgba(14, 99, 156, 0.14);
    }

    .point-list-row.is-dragging {
      opacity: 0.42;
      border-color: var(--accent);
    }

    .point-list-row strong {
      font-size: 11px;
      text-align: center;
    }

    .point-drag-handle {
      width: 24px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px dashed var(--border-strong);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--muted);
      cursor: grab;
      touch-action: none;
    }

    .point-drag-handle:hover,
    .point-drag-handle:focus-visible {
      color: var(--text);
      border-color: var(--accent);
      background: var(--surface-hover);
      outline: none;
    }

    .point-drag-handle:active {
      cursor: grabbing;
    }

    .point-drag-handle svg {
      width: 12px;
      height: 18px;
      fill: currentColor;
      pointer-events: none;
    }

    .list-section-title {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="map-shell">
    <div id="map"></div>
    <div class="map-overlay">
      <div class="map-top">
        <div class="map-stats">
          <div class="stat-chip" id="mission-chip">MISSION <strong>0</strong></div>
          <div class="stat-chip" id="selection-chip">SELECTED <strong>--</strong></div>
          <div class="stat-chip" id="cache-chip">CACHE <strong>0</strong></div>
          <div class="stat-chip" id="transfer-chip" data-state="idle" hidden>GÖREV <strong>--</strong></div>
        </div>
        <div class="map-top-right">
          <div class="floating-bar layer-toggle" id="layer-toggle"></div>
          <div class="gps-summary" id="gps-summary" data-state="offline">
            <span>GPS</span>
            <strong id="gps-fix">NO FIX</strong>
            <span id="gps-satellites">0 SAT</span>
            <span id="gps-hdop">HDOP --</span>
          </div>
        </div>
      </div>
      <div class="tool-dock" id="tool-dock"></div>
      <div class="hud-footer">
        <div class="hud-row">
          <span id="vehicle-readout">UAV LAT <strong>--</strong> LON <strong>--</strong></span>
          <span id="local-readout">LOCAL NED <strong>N -- · E -- · D -- m</strong></span>
        </div>
        <div class="hud-row">
          <span id="cursor-readout">CURSOR LAT <strong>0.00000</strong> LON <strong>0.00000</strong></span>
          <span id="zoom-readout">ZOOM <strong>0</strong></span>
          <span id="scale-readout">SCALE <strong>--</strong></span>
        </div>
      </div>
      <div id="context-menu" class="context-menu">
        <button data-action="goto"></button>
        <button data-action="center"></button>
        <button data-action="set_home"></button>
        <button data-action="delete"></button>
      </div>
      <div id="point-dialog" class="map-dialog small">
        <header><h3>NOKTA AYARLARI</h3></header>
        <div class="dialog-body">
          <label>Tip
            <select id="point-type-input"></select>
          </label>
          <label>Cap / Radius
            <input id="point-radius-input" type="number" min="5" max="1000" step="1">
          </label>
          <label>Irtifa (m)
            <input id="point-altitude-input" type="number" min="0" max="10000" step="1">
          </label>
          <label>Waypoint Sirasi
            <input id="point-order-input" type="number" min="1" max="999" step="1">
          </label>
        </div>
        <footer>
          <button data-point-action="cancel">Iptal</button>
          <button class="primary" data-point-action="apply">Uygula</button>
        </footer>
      </div>
      <div id="mission-dialog" class="map-dialog">
        <header><h3>MISSION POINTS</h3></header>
        <div class="dialog-body">
          <div class="list-section-title">Rota Noktalari</div>
          <div id="route-point-list" class="point-list"></div>
          <div class="list-section-title">Bagimsiz Noktalar / Alanlar</div>
          <div id="free-point-list" class="point-list"></div>
        </div>
        <footer>
          <button class="danger" data-mission-action="clear">Temizle</button>
          <button data-mission-action="cancel">Iptal</button>
          <button class="primary" data-mission-action="apply">Kaydet</button>
        </footer>
      </div>
    </div>
  </div>

  <script>
    if (typeof qt !== 'undefined' && qt.webChannelTransport) {
      document.write('<script src="qrc:///qtwebchannel/qwebchannel.js"><\/script>');
    }
  </script>
  <script src="./vendor/leaflet.js"></script>
  <script src="./vendor/Leaflet.Editable.js"></script>
  <script>
    const BLANK_TILE = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="%230d1116"/></svg>';
    const PRIMARY_TOOLS = ['pan', 'takeoff', 'waypoint', 'loiter', 'rtl', 'no_fly', 'safe_zone', 'land', 'mission_list', 'clear'];
    const TRANSFER_TOOLS = ['archive', 'send'];

    const TOOL_DOCK_MIN_GAP_PX = 4;

    let map;

    function iconSvg(name) {
      const icons = {
        pan: '<svg viewBox="0 0 24 24"><path d="M7 5l5 5-5 5"/><path d="M13 5l5 5-5 5"/></svg>',

        hss: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/></svg>',
        target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/></svg>',
        land: '<svg viewBox="0 0 24 24"><path d="M12 6v12"/><path d="M7 13l5 5 5-5"/><path d="M4 20h16"/></svg>',
        mission_list: '<svg viewBox="0 0 24 24"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
        archive: '<svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"/><path d="M8 14h8"/><path d="M12 10v8"/></svg>',
        send: '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-5 16-3-6z"/><path d="M12 14l-3 5"/></svg>',
        clear: '<svg viewBox="0 0 24 24"><path d="M4 8h16"/><path d="M8 8V5h8v3"/><path d="M6 8l1 11h10l1-11"/></svg>',
        contact: '<svg viewBox="0 0 24 24"><path d="M4 15l8-9 8 9"/><path d="M12 6v12"/><path d="M8 17h8"/></svg>',
        once: '<svg viewBox="0 0 24 24"><path d="M4 12h13"/><path d="M13 8l4 4-4 4"/><path d="M20 7v10"/></svg>',
        loop: '<svg viewBox="0 0 24 24"><path d="M17 7H8a5 5 0 0 0-4 2"/><path d="M17 7l-3-3"/><path d="M17 7l-3 3"/><path d="M7 17h9a5 5 0 0 0 4-2"/><path d="M7 17l3-3"/><path d="M7 17l3 3"/></svg>',
      };
      return icons[name] || icons.pan;
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      Object.entries(theme || {}).forEach(([key, value]) => {
        const cssKey = key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
        root.style.setProperty(`--${cssKey}`, value);
      });
    }

    function setToolbarTitles() {
      document.querySelectorAll('#tool-dock .tool-button').forEach((button) => {
        const tool = button.dataset.tool;
        const title = state.ui.tools[tool] || TOOL_DEFAULTS[tool];
        const label = button.querySelector('.tool-button-label');
        if (label) {
          label.textContent = title;
        }
        button.title = tool === 'send' && !state.commandAvailable
          ? `${title} — uçuş cihazı bağlı değil`
          : title;
      });
      document.querySelectorAll('#context-menu button').forEach((button) => {
        const action = button.dataset.action;
        button.textContent = state.ui.context[action] || CONTEXT_DEFAULTS[action];
      });
      if (homeReferenceMarker) {
        homeReferenceMarker.setTooltipContent(
          state.ui.context.set_home || CONTEXT_DEFAULTS.set_home,
        );
      }
      document.querySelectorAll('#layer-toggle button').forEach((button) => {
        const layer = button.dataset.layer;
        button.textContent = state.ui.layers[layer] || layer.toUpperCase();
      });
      const missionModeButton = document.querySelector(
        '#mission-mode-toggle .mission-mode-button',
      );
      if (missionModeButton) {
        const mode = state.missionLoop ? 'loop' : 'once';
        const label = state.ui.missionMode[mode] || mode.toUpperCase();
        const hint = state.missionLoop
          ? state.ui.missionMode.loopHint
          : state.ui.missionMode.onceHint;
        missionModeButton.title = `${label} — ${hint}`;
        missionModeButton.setAttribute('aria-label', label);
      }
      scheduleToolDockSpacing();
    }

    function updateToolDockSpacing() {
      toolDockSpacingFrame = 0;
      const container = document.getElementById('tool-dock');
      const shell = document.getElementById('map-shell');
      if (!container || !shell) return;
      const sections = Array.from(container.children);
      if (sections.length < 2) return;

      const sectionsWidth = sections.reduce(
        (total, section) => total + section.getBoundingClientRect().width,
        0,
      );
      const availableWidth = Math.max(
        0,
        shell.clientWidth - TOOL_DOCK_SIDE_CLEARANCE_PX * 2,
      );
      const idealGap = (
        availableWidth - sectionsWidth
      ) / (sections.length - 1);
      const gap = Math.max(
        TOOL_DOCK_MIN_GAP_PX,
        Math.min(TOOL_DOCK_MAX_GAP_PX, idealGap),
      );
      container.style.setProperty('--tool-group-gap', `${gap.toFixed(1)}px`);
      container.dataset.groupGap = gap.toFixed(1);
    }

    function scheduleToolDockSpacing() {
      if (toolDockSpacingFrame) {
        cancelAnimationFrame(toolDockSpacingFrame);
      }
      toolDockSpacingFrame = requestAnimationFrame(updateToolDockSpacing);
    }

    function observeToolDockSpacing() {
      if (toolDockResizeObserver || typeof ResizeObserver === 'undefined') {
        scheduleToolDockSpacing();
        return;
      }
      const shell = document.getElementById('map-shell');
      toolDockResizeObserver = new ResizeObserver(scheduleToolDockSpacing);
      toolDockResizeObserver.observe(shell);
      window.addEventListener('resize', scheduleToolDockSpacing);
      scheduleToolDockSpacing();
    }

    function buildLayerToggle() {
      const container = document.getElementById('layer-toggle');
      container.innerHTML = '';
      ['vector', 'satellite'].forEach((layer) => {
        const button = document.createElement('button');
        button.dataset.layer = layer;
        button.addEventListener('click', () => {
          window.ykiMap.setBaseLayer(layer);
          emitAction({ type: 'layer_changed', layer });
        });
        container.appendChild(button);
      });
      syncLayerState();
      setToolbarTitles();
    }

    function buildMissionModeToggle() {
      const container = document.createElement('div');
      container.className = 'mission-mode-toggle';
      container.id = 'mission-mode-toggle';

      const button = document.createElement('button');
      button.className = 'mission-mode-button';
      button.type = 'button';
      button.setAttribute('aria-pressed', String(state.missionLoop));
      button.addEventListener('click', () => {
        window.ykiMap.setMissionLoop(!state.missionLoop);
        emitAction({ type: 'mission_loop_changed', loop: state.missionLoop });
      });
      container.appendChild(button);
      return container;
    }

    function buildToolDock() {
      const container = document.getElementById('tool-dock');
      container.innerHTML = '';
      container.appendChild(buildMissionModeToggle());
      const buildButton = (tool) => {
        const button = document.createElement('button');
        button.className = 'tool-button';
        if (tool === 'mission_list') {
          button.classList.add('is-utility');
        }
        if (tool === 'archive') {
          button.classList.add('is-utility');
        }
        if (tool === 'send') {
          button.classList.add('is-send');
          button.disabled = !state.commandAvailable;
        }
        if (tool === 'clear') {
          button.classList.add('is-danger');
        }
        button.dataset.tool = tool;
        button.innerHTML = tool === 'send'
          ? `${iconSvg(tool)}<span class="tool-button-label">${state.ui.tools[tool] || TOOL_DEFAULTS[tool]}</span>`
          : iconSvg(tool);
        button.addEventListener('click', () => {
          if (tool === 'mission_list') {
            toggleMissionDialog();
            return;
          }
          if (tool === 'archive') {
            emitAction({ type: 'storage_request', action: 'archive' });
            return;
          }
          if (tool === 'send') {
            window.ykiMap.setMissionTransferState('pending', 'Görev planı uçuş cihazına gönderiliyor…');
            emitAction({ type: 'mission_send_request', loop: state.missionLoop });
            return;
          }
          if (tool === 'clear') {
            clearAllLocal();
            emitAction({ type: 'tool_changed', tool: 'clear' });
            return;
          }
          window.ykiMap.setActiveTool(tool);
          emitAction({ type: 'tool_changed', tool });
        });
        return button;
      };

      [
        ['tool-group', state.ui.primaryTools || PRIMARY_TOOLS],
        ['tool-group is-transfer', state.ui.transferTools || TRANSFER_TOOLS],
      ].forEach(([className, tools]) => {
        const group = document.createElement('div');
        group.className = className;
        tools.forEach((tool) => group.appendChild(buildButton(tool)));
        container.appendChild(group);
      });
      syncToolState();
      setToolbarTitles();
      setMissionDialogButtonState(
        document.getElementById('mission-dialog').style.display === 'block',
      );
      scheduleToolDockSpacing();
    }

    function syncToolState() {
      document.querySelectorAll('#tool-dock .tool-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.tool === state.activeTool);
      });
    }

    function syncLayerState() {
      document.querySelectorAll('#layer-toggle button').forEach((button) => {
        button.classList.toggle('active', button.dataset.layer === state.currentLayer);
      });
    }

    function syncMissionModeState() {
      const button = document.querySelector('#mission-mode-toggle .mission-mode-button');
      if (!button) return;
      const mode = state.missionLoop ? 'loop' : 'once';
      button.dataset.mode = mode;
      button.innerHTML = iconSvg(mode);
      button.setAttribute('aria-pressed', String(state.missionLoop));
      setToolbarTitles();
    }

    function updateGpsSummary(payload) {
      const summary = document.getElementById('gps-summary');
      const fix = String(payload?.gpsFix || 'NO FIX');
      const satellites = Math.max(0, Number(payload?.gpsSatellites) || 0);
      const hdop = Number(payload?.gpsHdop);
      const ready = Boolean(payload?.gpsReady);
      const connected = Boolean(payload?.commandAvailable);
      const gpsState = ready ? 'ready' : (connected ? 'waiting' : 'offline');
      const satelliteText = `${satellites} SAT`;
      const hdopText = Number.isFinite(hdop)
        ? `HDOP ${hdop.toFixed(1)}`
        : 'HDOP --';
      if (state.telemetryDisplay.gpsState !== gpsState) {
        state.telemetryDisplay.gpsState = gpsState;
        summary.dataset.state = gpsState;
      }
      if (state.telemetryDisplay.gpsFix !== fix) {
        state.telemetryDisplay.gpsFix = fix;
        document.getElementById('gps-fix').textContent = fix;
      }
      if (state.telemetryDisplay.gpsSatellites !== satelliteText) {
        state.telemetryDisplay.gpsSatellites = satelliteText;
        document.getElementById('gps-satellites').textContent = satelliteText;
      }
      if (state.telemetryDisplay.gpsHdop !== hdopText) {
        state.telemetryDisplay.gpsHdop = hdopText;
        document.getElementById('gps-hdop').textContent = hdopText;
      }
    }

    function emitAction(payload) {
      if (bridge && bridge.mapAction) {
        bridge.mapAction(JSON.stringify(payload));
      }
    }

    function originalPointerEvent(event) {
      return event && event.originalEvent ? event.originalEvent : event;
    }

    function isPrimaryPointerEvent(event) {
      const original = originalPointerEvent(event);
      if (!original || original.touches) {
        return true;
      }
      if (Number.isFinite(original.button)) {
        return original.button === 0;
      }
      return !Number.isFinite(original.which) || original.which === 1;
    }

    function isMiddlePointerEvent(event) {
      const original = originalPointerEvent(event);
      return Boolean(
        original
        && !original.touches
        && (original.button === 1 || original.which === 2)
      );
    }

    function installMiddleButtonMapPan() {
      const container = map.getContainer();
      container.addEventListener('mousedown', (event) => {
        if (!isMiddlePointerEvent(event)) {
          return;
        }
        // Leaflet 1.9 treats the middle button as both map and marker/vertex
        // dragging. Route the event directly to the map draggable before it
        // reaches layers so mission and reference points remain unchanged.
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
        const draggable = map.dragging && map.dragging._draggable;
        if (map.dragging && map.dragging.enabled() && draggable) {
          draggable._onDown(event);
        }
      }, true);
      container.addEventListener('auxclick', (event) => {
        if (isMiddlePointerEvent(event)) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    }

    function normalizeType(type) {
      const mapTypes = {
        polyline: 'route',
        polygon: 'survey',
        circle: 'target',
      };
      return mapTypes[type] || type;
    }

    function isSourceManagedLayer(layer) {
      const type = normalizeType(layer?.overlayData?.overlay_type || '');
      const metadata = layer?.overlayData?.metadata || {};
      const source = String(metadata.source || '').trim().toLowerCase();
      return metadata.read_only === true
        || source.startsWith('teknofest-')
        || type === 'hss'
        || type === 'target';
    }

    function isEditableLayer(layer) {
      return Boolean(layer) && !isSourceManagedLayer(layer);
    }

    function isDraggablePointLayer(layer) {
      return Boolean(
        layer
        && layer instanceof L.Circle
        && POINT_TYPES.has(normalizeType(layer.overlayData?.overlay_type))
        && normalizeType(layer.overlayData?.overlay_type) !== 'rtl'
        && isEditableLayer(layer)
      );
    }

    function isArchivableLayer(layer) {
      const metadata = layer?.overlayData?.metadata || {};
      return isEditableLayer(layer) && metadata.persistent !== false;
    }

    function colorFor(type) {
      return COLORS[normalizeType(type)] || '#61a8ff';
    }

    function radiusFor(type) {
      return state.defaultRadii[normalizeType(type)] || DEFAULT_RADII[normalizeType(type)] || 35;
    }

    function defaultAltitudeFor(type) {
      return normalizeType(type) === 'land' ? 0 : Number(state.defaultAltitude || 100);
    }

    function altitudeForLayer(layer) {
      const rawAltitude = layer?.overlayData?.altitude_m;
      if (rawAltitude === null || rawAltitude === undefined || rawAltitude === '') {
        return null;
      }
      const altitude = Number(rawAltitude);
      return Number.isFinite(altitude) ? altitude : null;
    }

    function inferLabel(type) {
      const normalized = normalizeType(type);
      const count = state.overlayOrder.filter((overlayId) => {
        const layer = state.layers.get(overlayId);
        return layer && layer.overlayData.overlay_type === normalized;
      }).length + 1;
      const labels = {
        takeoff: `TKF ${count}`,
        waypoint: `WP ${count}`,
        loiter: `LTR ${count}`,
        rtl: `RTL ${count}`,
        rally: `RLY ${count}`,
        route: `ROT ${count}`,
        survey: `ALN ${count}`,
        no_fly: `NFZ ${count}`,
        safe_zone: `SAFE ${count}`,
        hss: `HSS ${count}`,
        target: `HDF ${count}`,
        land: 'LND',
        goto: 'GOTO',
      };
      return labels[normalized] || normalized.toUpperCase();
    }

    function labelForPoint(type, order = null) {
      const normalized = normalizeType(type);
      const routeLabels = {
        takeoff: 'TKF',
        waypoint: 'WP',
        loiter: 'LTR',
        rtl: 'RTL',
        land: 'LND',
      };
      if (ROUTE_TYPES.has(normalized)) {
        return `${routeLabels[normalized] || normalized.toUpperCase()} ${order || routeLayers().length + 1}`;
      }
      if (normalized === 'hss') {
        return `HSS ${freeLayers().filter((layer) => layer.overlayData.overlay_type === 'hss').length + 1}`;
      }
      return inferLabel(normalized);
    }

    function styleFor(type, selected) {
      const normalized = normalizeType(type);
      const base = {
        color: colorFor(normalized),
        opacity: 0.96,
        fillColor: colorFor(normalized),
        fillOpacity: 0.0,
        weight: selected ? 3.4 : 2.2,
      };
      if (normalized === 'route') {
        return { ...base, dashArray: '8 5', weight: selected ? 3.2 : 2.5, fillOpacity: 0.0 };
      }
      if (normalized === 'survey') {
        return { ...base, fillOpacity: selected ? 0.12 : 0.06 };
      }
      if (normalized === 'no_fly') {
        return { ...base, fillOpacity: selected ? 0.12 : 0.07, dashArray: '10 5' };
      }
      if (normalized === 'safe_zone') {
        return { ...base, color: '#73d06b', fillOpacity: 0.0, dashArray: '12 4', weight: selected ? 3.2 : 2.4 };
      }
      if (normalized === 'hss') {
        return { ...base, fillOpacity: selected ? 0.12 : 0.06, dashArray: '2 4', weight: selected ? 3.0 : 2.2 };
      }
      if (normalized === 'loiter') {
        return { ...base, fillOpacity: selected ? 0.10 : 0.04, dashArray: '4 4' };
      }
      if (normalized === 'target') {
        return { ...base, fillOpacity: selected ? 0.10 : 0.05, dashArray: '2 5' };
      }
      return base;
    }

    function markerIcon(type, selected) {
      const color = colorFor(type);
      const cls = selected ? 'marker-icon selected' : 'marker-icon';
      return L.divIcon({
        className: 'map-marker-wrap',
        html: `<div class="${cls}" style="--marker-color:${color}">${iconSvg(type)}</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
      });
    }

    function aircraftSvg() {
      return '<svg viewBox="0 0 40 40"><path class="airframe" d="M20 4.5 30.2 34.5 20 29.2 9.8 34.5z"/><path class="spine" d="M20 9.5v18.8"/><path class="wing" d="M14.6 23.8 20 18.7l5.4 5.1"/><path class="wing" d="M16.5 31.4 20 28.2l3.5 3.2"/></svg>';
    }

    function homeReferenceIcon() {
      return L.divIcon({
        className: 'home-reference-wrap',
        html: '<div class="home-reference-marker"><span>H</span></div>',
        iconSize: [27, 27],
        iconAnchor: [4, 23],
      });
    }

    function createHomeReferenceMarker(latlng) {
      const marker = L.marker(latlng, {
        draggable: true,
        bubblingMouseEvents: false,
        keyboard: false,
        zIndexOffset: 850,
        icon: homeReferenceIcon(),
      });
      marker.bindTooltip('Home / Reference', {
        direction: 'top',
        offset: [9, -19],
      });
      marker.on('dragstart', () => {
        hideContextMenu();
        state.homeReferenceDragging = true;
        const current = marker.getLatLng();
        state.homeReferenceRollbackLatLng = L.latLng(current.lat, current.lng);
      });
      marker.on('dragend', (event) => {
        const destination = event.target.getLatLng();
        state.homeReferenceDragging = false;
        setHomeReference(
          destination,
          true,
          state.homeReferenceRollbackLatLng,
        );
      });
      marker.on('contextmenu', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        showContextMenu(event.containerPoint, event.latlng);
      });
      return marker;
    }

    function setHomeReference(
      latlng,
      shouldNotify = false,
      rollbackLatLng = null,
    ) {
      if (!homeReferenceMarker || !latlng) {
        return;
      }
      if (shouldNotify && state.homeReferencePending) {
        return;
      }
      const position = L.latLng(Number(latlng.lat), Number(latlng.lng));
      if (
        !Number.isFinite(position.lat)
        || !Number.isFinite(position.lng)
        || position.lat < -90
        || position.lat > 90
        || position.lng < -180
        || position.lng > 180
      ) {
        return;
      }
      const previous = homeReferenceMarker.getLatLng();
      homeReferenceMarker.setLatLng(position);
      if (map && !map.hasLayer(homeReferenceMarker)) {
        homeReferenceMarker.addTo(map);
      }
      state.homeReferenceInitialized = true;
      syncRtlMarkersToHome();
      refreshMissionRoute();
      if (shouldNotify) {
        const rollback = rollbackLatLng || previous;
        state.homeReferenceRollbackLatLng = L.latLng(
          rollback.lat,
          rollback.lng,
        );
        state.homeReferenceCommandedLatLng = null;
        state.homeReferencePending = true;
        state.homeReferencePendingUntil = Date.now() + 15000;
        if (homeReferenceMarker.dragging) {
          homeReferenceMarker.dragging.disable();
        }
        emitAction({
          type: 'set_home_reference',
          lat: position.lat,
          lon: position.lng,
          previous_lat: rollback.lat,
          previous_lon: rollback.lng,
        });
      }
    }

    function updateHomeReference(payload) {
      // HOME_POSITION may keep arriving while Leaflet is moving the marker.
      // Do not let an older telemetry sample fight the operator's drag.
      if (state.homeReferenceDragging) {
        return;
      }
      const available = Boolean(payload?.homePositionAvailable);
      const latitude = Number(payload?.homeLat);
      const longitude = Number(payload?.homeLon);
      if (
        !available
        || !Number.isFinite(latitude)
        || !Number.isFinite(longitude)
        || latitude < -90
        || latitude > 90
        || longitude < -180
        || longitude > 180
      ) {
        return;
      }
      const telemetryPosition = L.latLng(latitude, longitude);
      if (state.homeReferenceCommandedLatLng) {
        const commandedDistance = (
          state.homeReferenceCommandedLatLng.distanceTo(telemetryPosition)
        );
        if (commandedDistance <= 2.0) {
          state.homeReferenceCommandedLatLng = null;
        } else {
          // A successful SET_HOME acknowledgement is authoritative. Some
          // autopilots keep publishing the previous HOME_POSITION briefly,
          // or do not publish it again at all.
          return;
        }
      }
      if (state.homeReferencePending) {
        const distance = homeReferenceMarker.getLatLng().distanceTo(telemetryPosition);
        if (distance <= 2.0) {
          state.homeReferencePending = false;
        } else if (Date.now() < state.homeReferencePendingUntil) {
          return;
        } else {
          state.homeReferencePending = false;
        }
      }
      setHomeReference(telemetryPosition, false);
    }

    function contactColor(data) {
      const id = String(data.contact_id || '').toLowerCase();
      const source = String(data.source || '').toLowerCase();
      return id.includes('own') || source === 'ownship' ? '#58a6ff' : '#e05d5d';
    }

    function contactIcon(data) {
      const color = contactColor(data);
      return L.divIcon({
        className: 'contact-marker-wrap',
        html: `<div class="aircraft-icon" style="--aircraft-color:${color};transform:rotate(${data.heading || 0}deg)">${aircraftSvg()}</div>`,
        iconSize: [31, 31],
        iconAnchor: [15, 15],
      });
    }

    function contactTooltip(data) {
      const metadata = data.metadata || {};
      const parts = [String(data.label || data.contact_id || 'Temas')];
      if (Number.isFinite(Number(metadata.altitude_m))) {
        parts.push(`${Number(metadata.altitude_m).toFixed(0)} m`);
      }
      if (Number.isFinite(Number(data.speed))) {
        parts.push(`${Number(data.speed).toFixed(1)} m/s`);
      }
      if (Number.isFinite(Number(metadata.data_age_ms))) {
        parts.push(`${Number(metadata.data_age_ms)} ms`);
      }
      return parts.join(' · ');
    }

    function labelPositionForLayer(layer) {
      if (layer instanceof L.Marker || layer instanceof L.Circle) {
        return layer.getLatLng();
      }
      if (layer instanceof L.Polygon) {
        return layer.getBounds().getCenter();
      }
      const latlngs = layer.getLatLngs();
      const points = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
      return points[Math.floor(points.length / 2)] || null;
    }

    function updateLabel(layer, selected) {
      const id = layer.overlayData.overlay_id;
      const position = labelPositionForLayer(layer);
      if (!position) {
        return;
      }
      const color = colorFor(layer.overlayData.overlay_type);
      const altitude = altitudeForLayer(layer);
      const altitudeLabel = ALTITUDE_TYPES.has(layer.overlayData.overlay_type) && altitude !== null
        ? ` · ${altitude.toFixed(0)} m`
        : '';
      const html = `<div class="overlay-label ${selected ? 'selected' : ''}" style="--label-color:${color}">${layer.overlayData.label}${altitudeLabel}</div>`;
      let marker = state.labelLayers.get(id);
      if (!marker) {
        marker = L.marker(position, {
          interactive: true,
          // A label is not a second drag handle for its point. Leaflet can
          // interpret a normal label click as dragstart and prevent the point
          // settings dialog from opening.
          draggable: false,
          bubblingMouseEvents: false,
          icon: L.divIcon({ className: 'overlay-label-wrap', html }),
        });
        labelGroup.addLayer(marker);
        state.labelLayers.set(id, marker);
        registerLabelEvents(marker, layer);
      } else {
        marker.setLatLng(position);
        marker.setIcon(L.divIcon({ className: 'overlay-label-wrap', html }));
        if (marker.dragging) {
          marker.dragging.disable();
        }
      }
    }

    function registerLabelEvents(marker, layer) {
      marker.on('mousedown', (event) => {
        if (!isPrimaryPointerEvent(event) || !isDraggablePointLayer(layer)) {
          return;
        }
        beginPointDrag(layer, event);
      });
      marker.on('click', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        if (state.draggingPoint || state.dragMoved || state.suppressPointClick) {
          return;
        }
        selectOverlay(layer.overlayData.overlay_id);
        if (POINT_TYPES.has(layer.overlayData.overlay_type) && isEditableLayer(layer)) {
          openPointDialog(layer.overlayData.overlay_id);
        }
      });
      marker.on('contextmenu', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        selectOverlay(layer.overlayData.overlay_id);
        showContextMenu(
          event.containerPoint,
          event.latlng,
          layer.overlayData.overlay_id,
        );
      });
    }

    function polygonPoints(layer) {
      const latlngs = layer.getLatLngs();
      const first = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
      return first.map((point) => [point.lat, point.lng]);
    }

    function updateSafeMask(layer) {
      if (layer.overlayData.overlay_type !== 'safe_zone') {
        refreshSafeMask();
        return;
      }
      refreshSafeMask();
    }

    function refreshSafeMask() {
      if (!safeMaskGroup) {
        return;
      }
      safeMaskGroup.clearLayers();
      state.safeMasks.clear();
      const outer = [[-85, -180], [-85, 180], [85, 180], [85, -180]];
      const holes = [];
      state.layers.forEach((candidate) => {
        if (candidate.overlayData.overlay_type === 'safe_zone') {
          const points = polygonPoints(candidate);
          if (points.length >= 3) {
            holes.push(points);
          }
        }
      });
      if (!holes.length) {
        return;
      }
      const options = {
        color: '#eb6464',
        weight: 0,
        opacity: 0,
        fillColor: '#eb6464',
        fillOpacity: 0.10,
        fillRule: 'evenodd',
        interactive: false,
      };
      const mask = L.polygon([outer, ...holes], options);
      safeMaskGroup.addLayer(mask);
      state.safeMasks.set('combined', mask);
    }

    function removeSafeMask(id) {
      void id;
      refreshSafeMask();
    }

    function removeLabel(id) {
      if (!state.labelLayers.has(id)) {
        return;
      }
      labelGroup.removeLayer(state.labelLayers.get(id));
      state.labelLayers.delete(id);
    }

    function serializePoints(layer) {
      if (layer instanceof L.Marker) {
        const point = layer.getLatLng();
        const altitude = altitudeForLayer(layer);
        return [[point.lat, point.lng, ...(altitude !== null ? [altitude] : [])]];
      }
      if (layer instanceof L.Circle) {
        const center = layer.getLatLng();
        const altitude = altitudeForLayer(layer);
        return [[center.lat, center.lng, ...(altitude !== null ? [altitude] : [])]];
      }
      const latLngs = layer.getLatLngs();
      const first = Array.isArray(latLngs[0]) ? latLngs[0] : latLngs;
      return first.map((point) => [point.lat, point.lng]);
    }

    function serializeLayer(layer) {
      return {
        overlay_id: layer.overlayData.overlay_id,
        overlay_type: layer.overlayData.overlay_type,
        label: layer.overlayData.label,
        points: serializePoints(layer),
        radius_m: layer instanceof L.Circle ? layer.getRadius() : null,
        color: layer.overlayData.color,
        metadata: layer.overlayData.metadata || {},
      };
    }

    function emitOverlay(layer) {
      if (isEditableLayer(layer) && bridge && bridge.overlayChanged) {
        bridge.overlayChanged(JSON.stringify(serializeLayer(layer)));
      }
    }

    function layerCenter(layer) {
      const center = labelPositionForLayer(layer);
      if (!center) {
        return { lat: 0, lon: 0 };
      }
      return { lat: center.lat, lon: center.lng };
    }

    function emitMissionItem(layer) {
      const center = layerCenter(layer);
      emitAction({
        type: 'mission_item_created',
        item_type: layer.overlayData.overlay_type,
        lat: center.lat,
        lon: center.lon,
        radius_m: layer instanceof L.Circle ? layer.getRadius() : 0,
      });
    }

    function disableEditing(layer) {
      if (layer && layer.disableEdit) {
        layer.disableEdit();
      }
    }

    function enableEditing(layer) {
      if (isEditableLayer(layer) && layer.enableEdit && !(layer instanceof L.Marker)) {
        layer.enableEdit(map);
      }
    }

    function syncMissionStats() {
      document.querySelector('#mission-chip strong').textContent = String(routeLayers().length);
      document.querySelector('#selection-chip strong').textContent = state.selectedId ? state.selectedId.slice(0, 8).toUpperCase() : '--';
    }

    function selectOverlay(id) {
      if (state.selectedId && state.layers.has(state.selectedId)) {
        const previous = state.layers.get(state.selectedId);
        disableEditing(previous);
        setLayerVisual(previous, false);
      }
      state.selectedId = id || null;
      if (state.selectedId && state.layers.has(state.selectedId)) {
        const current = state.layers.get(state.selectedId);
        enableEditing(current);
        setLayerVisual(current, true);
      }
      syncMissionStats();
      if (bridge && bridge.overlaySelected) {
        bridge.overlaySelected(state.selectedId || '');
      }
    }

    function setLayerVisual(layer, selected) {
      if (layer instanceof L.Marker) {
        layer.setIcon(markerIcon(layer.overlayData.overlay_type, selected));
      } else {
        layer.setStyle(styleFor(layer.overlayData.overlay_type, selected));
      }
      updateSafeMask(layer);
      updateLabel(layer, selected);
    }

    function mergeUniquePoints(points) {
      const merged = [];
      (points || []).forEach((point) => {
        const normalized = Array.isArray(point) ? point : [point.lat, point.lng];
        if (!merged.length || merged[merged.length - 1][0] !== normalized[0] || merged[merged.length - 1][1] !== normalized[1]) {
          merged.push(normalized);
        }
      });
      return merged;
    }

    function flattenLayerLatLngs(values, points = []) {
      (values || []).forEach((value) => {
        if (Array.isArray(value)) {
          flattenLayerLatLngs(value, points);
        } else if (
          value
          && Number.isFinite(Number(value.lat))
          && Number.isFinite(Number(value.lng))
        ) {
          points.push([Number(value.lat), Number(value.lng)]);
        }
      });
      return points;
    }

    function orderedOverlayIds() {
      const known = state.overlayOrder.filter((overlayId) => state.layers.has(overlayId));
      state.layers.forEach((_, overlayId) => {
        if (!known.includes(overlayId)) {
          known.push(overlayId);
        }
      });
      return known;
    }

    function homeReferenceLatLng() {
      if (!homeReferenceMarker) {
        return null;
      }
      const point = homeReferenceMarker.getLatLng();
      return (
        Number.isFinite(Number(point?.lat))
        && Number.isFinite(Number(point?.lng))
      ) ? L.latLng(Number(point.lat), Number(point.lng)) : null;
    }

    function syncRtlMarkersToHome() {
      const home = homeReferenceLatLng();
      if (!home) {
        return;
      }
      state.layers.forEach((layer) => {
        if (
          normalizeType(layer.overlayData?.overlay_type) === 'rtl'
          && layer instanceof L.Circle
        ) {
          layer.setLatLng(home);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
        }
      });
    }

    function refreshMissionRoute() {
      if (!missionRouteLine) {
        return;
      }
      const orderedLayers = routeLayers();
      const routePoints = [];
      const repeatablePoints = [];
      let hasTerminalItem = false;
      let rtlOrigin = null;
      let rtlDestination = null;
      for (const layer of orderedLayers) {
        const type = normalizeType(layer.overlayData.overlay_type);
        if (type === 'rtl') {
          hasTerminalItem = true;
          const lastRoutePoint = routePoints.at(-1);
          const vehiclePoint = ownVehicleLatLng();
          rtlOrigin = lastRoutePoint
            ? L.latLng(lastRoutePoint[0], lastRoutePoint[1])
            : vehiclePoint;
          rtlDestination = homeReferenceLatLng();
          break;
        }
        const layerPoints = type === 'route' && layer.getLatLngs
          ? mergeUniquePoints(flattenLayerLatLngs(layer.getLatLngs()))
          : (() => {
              const center = layerCenter(layer);
              return [[center.lat, center.lon]];
            })();
        routePoints.push(...layerPoints);
        if (['waypoint', 'route'].includes(type)) {
          repeatablePoints.push(...layerPoints);
        }
        if (['land', 'loiter'].includes(type)) {
          hasTerminalItem = true;
          break;
        }
      }
      if (
        state.missionLoop
        && !hasTerminalItem
        && repeatablePoints.length > 1
      ) {
        routePoints.push(repeatablePoints[0]);
      }
      missionRouteLine.setLatLngs(mergeUniquePoints(routePoints));
      if (rtlReturnLine) {
        rtlReturnLine.setLatLngs(
          rtlOrigin && rtlDestination
            ? [rtlOrigin, rtlDestination]
            : [],
        );
      }
    }

    function routeOrderFor(layer) {
      return Number(layer.overlayData.metadata?.route_order || 999);
    }

    function routeLayers() {
      return orderedOverlayIds()
        .map((overlayId) => state.layers.get(overlayId))
        .filter((layer) => layer && ROUTE_TYPES.has(layer.overlayData.overlay_type))
        .sort((a, b) => routeOrderFor(a) - routeOrderFor(b));
    }

    function freeLayers() {
      return orderedOverlayIds()
        .map((overlayId) => state.layers.get(overlayId))
        .filter((layer) => layer
          && !ROUTE_TYPES.has(layer.overlayData.overlay_type)
          && isArchivableLayer(layer));
    }

    function registerLayerEvents(layer) {
      layer.on('mousedown', (event) => {
        if (!isPrimaryPointerEvent(event)) {
          return;
        }
        L.DomEvent.stop(event.originalEvent || event);
        if (state.activeTool === 'pan' && isDraggablePointLayer(layer)) {
          beginPointDrag(layer, event);
        }
      });

      layer.on('click', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        if (state.draggingPoint || state.dragMoved || state.suppressPointClick) {
          state.dragMoved = false;
          return;
        }
        selectOverlay(layer.overlayData.overlay_id);
        if (POINT_TYPES.has(layer.overlayData.overlay_type) && isEditableLayer(layer)) {
          openPointDialog(layer.overlayData.overlay_id);
        }
      });

      layer.on('contextmenu', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        selectOverlay(layer.overlayData.overlay_id);
        showContextMenu(
          event.containerPoint,
          event.latlng,
          layer.overlayData.overlay_id,
        );
      });

      if (layer instanceof L.Marker && layer.dragging) {
        layer.on('dragend', () => {
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
      }

      if (!(layer instanceof L.Marker)) {
        layer.on('editable:vertex:dragend', () => {
          updateSafeMask(layer);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
        layer.on('editable:dragend', () => {
          updateSafeMask(layer);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
        layer.on('editable:vertex:deleted', () => {
          updateSafeMask(layer);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
      }
    }

    function beginPointDrag(layer, event) {
      if (
        !isPrimaryPointerEvent(event)
        || !isDraggablePointLayer(layer)
        || state.draggingPoint
      ) {
        return;
      }
      const originalEvent = originalPointerEvent(event);
      L.DomEvent.stop(originalEvent);
      if (originalEvent?.preventDefault) {
        originalEvent.preventDefault();
      }
      selectOverlay(layer.overlayData.overlay_id);
      hideDialogs();
      state.draggingPoint = layer.overlayData.overlay_id;
      state.dragMoved = false;
      const containerRect = map.getContainer().getBoundingClientRect();
      const eventContainerPoint = event?.containerPoint;
      const startClientX = Number.isFinite(Number(originalEvent?.clientX))
        ? Number(originalEvent.clientX)
        : containerRect.left + Number(eventContainerPoint?.x || 0);
      const startClientY = Number.isFinite(Number(originalEvent?.clientY))
        ? Number(originalEvent.clientY)
        : containerRect.top + Number(eventContainerPoint?.y || 0);
      const movementThresholdSquared = 9;
      let pendingLatLng = null;
      let dragFrame = 0;
      if (map.dragging) {
        map.dragging.disable();
      }

      const renderPendingPosition = () => {
        dragFrame = 0;
        if (!state.draggingPoint || !state.layers.has(state.draggingPoint)) {
          return;
        }
        const current = state.layers.get(state.draggingPoint);
        if (current instanceof L.Circle && pendingLatLng) {
          current.setLatLng(pendingLatLng);
          updateLabel(current, true);
          refreshMissionRoute();
        }
      };

      const move = (moveEvent) => {
        if (!state.draggingPoint) {
          return;
        }
        const deltaX = Number(moveEvent.clientX) - startClientX;
        const deltaY = Number(moveEvent.clientY) - startClientY;
        if (!state.dragMoved && deltaX * deltaX + deltaY * deltaY < movementThresholdSquared) {
          return;
        }
        state.dragMoved = true;
        const latestRect = map.getContainer().getBoundingClientRect();
        pendingLatLng = map.containerPointToLatLng([
          Number(moveEvent.clientX) - latestRect.left,
          Number(moveEvent.clientY) - latestRect.top,
        ]);
        if (!dragFrame) {
          dragFrame = window.requestAnimationFrame(renderPendingPosition);
        }
        moveEvent.preventDefault();
      };

      const finish = () => {
        document.removeEventListener('mousemove', move, true);
        document.removeEventListener('mouseup', finish, true);
        window.removeEventListener('blur', finish);
        if (dragFrame) {
          window.cancelAnimationFrame(dragFrame);
          renderPendingPosition();
        }
        const draggedOverlayId = state.draggingPoint;
        const moved = state.dragMoved;
        state.draggingPoint = null;
        const current = state.layers.get(draggedOverlayId);
        if (current && moved) {
          updateLabel(current, true);
          refreshMissionRoute();
          emitOverlay(current);
        }
        if (moved) {
          state.suppressPointClick = true;
          window.setTimeout(() => {
            state.suppressPointClick = false;
          }, 180);
        }
        state.dragMoved = false;
        if (map.dragging) {
          map.dragging.enable();
        }
      };
      document.addEventListener('mousemove', move, true);
      document.addEventListener('mouseup', finish, true);
      window.addEventListener('blur', finish, { once: true });
    }

    function attachLayer(layer, orderIndex = null) {
      overlayGroup.addLayer(layer);
      state.layers.set(layer.overlayData.overlay_id, layer);
      if (orderIndex === null || orderIndex < 0 || orderIndex > state.overlayOrder.length) {
        if (!state.overlayOrder.includes(layer.overlayData.overlay_id)) {
          state.overlayOrder.push(layer.overlayData.overlay_id);
        }
      } else if (!state.overlayOrder.includes(layer.overlayData.overlay_id)) {
        state.overlayOrder.splice(orderIndex, 0, layer.overlayData.overlay_id);
      }
      setLayerVisual(layer, state.selectedId === layer.overlayData.overlay_id);
      registerLayerEvents(layer);
      refreshMissionRoute();
      syncMissionStats();
    }

    function createLayerFromData(data) {
      const type = normalizeType(data.overlay_type);
      const points = data.points || [];
      const pointAltitude = Number(points[0]?.[2]);
      const metadataAltitude = Number(data.metadata?.altitude_m ?? data.metadata?.altitude);
      const altitude = Number.isFinite(pointAltitude)
        ? pointAltitude
        : (Number.isFinite(metadataAltitude)
          ? metadataAltitude
          : (ALTITUDE_TYPES.has(type) ? defaultAltitudeFor(type) : null));
      let layer = null;
      if (POINT_TYPES.has(type)) {
        const point = type === 'rtl'
          ? (homeReferenceLatLng() || points[0])
          : points[0];
        layer = L.circle(point, {
          ...styleFor(type, false),
          radius: data.radius_m || radiusFor(type),
          bubblingMouseEvents: false,
        });
      } else if (type === 'route') {
        layer = L.polyline(points, styleFor(type, false));
      } else {
        layer = L.polygon(points, styleFor(type, false));
      }
      layer.overlayData = {
        overlay_id: data.overlay_id,
        overlay_type: type,
        label: data.label || inferLabel(type),
        color: data.color || colorFor(type),
        metadata: data.metadata || {},
        altitude_m: altitude,
      };
      return layer;
    }

    function removeOverlayById(id, shouldNotify = true) {
      if (!state.layers.has(id)) {
        return;
      }
      const layer = state.layers.get(id);
      if (shouldNotify && isSourceManagedLayer(layer)) {
        return false;
      }
      overlayGroup.removeLayer(layer);
      state.layers.delete(id);
      state.overlayOrder = state.overlayOrder.filter((overlayId) => overlayId !== id);
      removeLabel(id);
      removeSafeMask(id);
      if (state.selectedId === id) {
        state.selectedId = null;
      }
      if (shouldNotify && bridge && bridge.overlayRemoved) {
        bridge.overlayRemoved(id);
      }
      refreshMissionRoute();
      syncMissionStats();
      return true;
    }

    function upsertOverlay(data) {
      const overlayId = data.overlay_id;
      const existingIndex = state.overlayOrder.indexOf(overlayId);
      const wasSelected = state.selectedId === overlayId;
      if (state.layers.has(overlayId)) {
        removeOverlayById(overlayId, false);
      }
      const layer = createLayerFromData(data);
      attachLayer(layer, existingIndex >= 0 ? existingIndex : state.overlayOrder.length);
      if (wasSelected) {
        selectOverlay(overlayId);
      }
    }

    function setOverlayOrder(order) {
      const unique = [];
      (order || []).forEach((overlayId) => {
        if (state.layers.has(overlayId) && !unique.includes(overlayId)) {
          unique.push(overlayId);
        }
      });
      state.layers.forEach((_, overlayId) => {
        if (!unique.includes(overlayId)) {
          unique.push(overlayId);
        }
      });
      state.overlayOrder = unique;
      refreshMissionRoute();
      syncMissionStats();
    }

    function finishNewLayer(layer, type) {
      const normalized = normalizeType(type);
      const nextRouteOrder = ROUTE_TYPES.has(normalized) ? routeLayers().length + 1 : null;
      layer.overlayData = {
        overlay_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        overlay_type: normalized,
        label: POINT_TYPES.has(normalized) ? labelForPoint(normalized, nextRouteOrder) : inferLabel(normalized),
        color: colorFor(normalized),
        metadata: {
          route_order: nextRouteOrder,
          independent: !ROUTE_TYPES.has(normalized),
          keep_inside: normalized === 'safe_zone',
        },
        altitude_m: ALTITUDE_TYPES.has(normalized) ? defaultAltitudeFor(normalized) : null,
      };
      attachLayer(layer);
      selectOverlay(layer.overlayData.overlay_id);
      emitOverlay(layer);
      emitMissionItem(layer);
      if (POLYGON_TYPES.has(normalized)) {
        window.setTimeout(() => startShapeTool(normalized), 0);
      }
    }

    function addPointOverlay(type, latlng) {
      const normalized = normalizeType(type);
      const point = normalized === 'rtl'
        ? (homeReferenceLatLng() || latlng)
        : latlng;
      const layer = L.circle(point, {
        ...styleFor(normalized, false),
        radius: radiusFor(normalized),
        bubblingMouseEvents: false,
      });
      finishNewLayer(layer, normalized);
      if (normalized === 'land') {
        emitAction({ type: 'land_request', lat: latlng.lat, lon: latlng.lng });
      }
      if (normalized === 'takeoff') {
        emitAction({ type: 'takeoff_request', lat: latlng.lat, lon: latlng.lng });
      }
    }

    function addGotoCommand(latlng) {
      emitAction({ type: 'goto_request', lat: latlng.lat, lon: latlng.lng });

    function emitBounds() {
      const center = map.getCenter();
      const bounds = map.getBounds();
      document.querySelector('#zoom-readout strong').textContent = String(map.getZoom());
      updateScaleReadout();
      if (bridge && bridge.boundsChanged) {
        bridge.boundsChanged(JSON.stringify({
          center: { lat: center.lat, lng: center.lng },
          northEast: bounds.getNorthEast(),
          southWest: bounds.getSouthWest(),
          layer: state.currentLayer,
          zoom: map.getZoom(),
        }));
      }
    }

    function updateScaleReadout() {
      const readout = document.querySelector('#scale-readout strong');
      if (!readout || !map) {
        return;
      }
      const size = map.getSize();
      const sampleWidth = Math.min(100, Math.max(1, size.x));
      const sampleY = Math.max(0, size.y / 2);
      const maxMeters = map.distance(
        map.containerPointToLatLng([0, sampleY]),
        map.containerPointToLatLng([sampleWidth, sampleY]),
      );
      if (!Number.isFinite(maxMeters) || maxMeters <= 0) {
        readout.textContent = '--';
        return;
      }
      const magnitude = 10 ** Math.floor(Math.log10(maxMeters));
      const normalized = maxMeters / magnitude;
      const step = normalized >= 5
        ? 5
        : normalized >= 3
          ? 3
          : normalized >= 2
            ? 2
            : 1;
      const roundedMeters = step * magnitude;
      readout.textContent = roundedMeters >= 1000
        ? `${roundedMeters / 1000} km`
        : `${roundedMeters} m`;
    }

    function updateCursor(latlng) {
      const signature = `${latlng.lat.toFixed(5)}:${latlng.lng.toFixed(5)}`;
      if (state.lastCursor === signature) {
        return;
      }
      state.lastCursor = signature;
      document.querySelector('#cursor-readout').innerHTML = `CURSOR LAT <strong>${latlng.lat.toFixed(5)}</strong> LON <strong>${latlng.lng.toFixed(5)}</strong>`;
    }

    function queueCursorUpdate(latlng) {
      state.pendingCursor = latlng;
      if (state.cursorFrame) {
        return;
      }
      state.cursorFrame = window.requestAnimationFrame(() => {
        state.cursorFrame = 0;
        if (state.pendingCursor) {
          updateCursor(state.pendingCursor);
        }
      });

    function notifyTileProblem(name) {
      if (state.tileNotified[name]) {
        return;
      }
      state.tileNotified[name] = true;
      emitAction({
        type: 'tile_notice',
        message: name === 'satellite'
          ? 'Uydu katmaninda bazi tile istekleri yuklenemedi'
          : 'Vektorel katmanda bazi tile istekleri yuklenemedi',
      });
    }

    function buildTileLayer(url, name, options = {}) {
      const layer = L.tileLayer(url, {
        minZoom: 3,
        maxZoom: 21,
        maxNativeZoom: 20,
        crossOrigin: false,
        updateWhenIdle: true,
        updateWhenZooming: false,
        keepBuffer: 1,
        detectRetina: false,
        errorTileUrl: BLANK_TILE,
        ...options,
      });
      layer.on('tileerror', () => notifyTileProblem(name));
      return layer;
    }

    function proxyTileUrl(provider, variant, extension = 'png') {
      const baseUrl = (state.tileCache.baseUrl || '').replace(/\/$/, '');
      if (!baseUrl || state.tileCache.enabled === false) {
        return null;
      }
      return `${baseUrl}/tile/${provider}/${variant}/{z}/{x}/{y}.${extension}`;
    }

    function remoteCartoUrl(style) {
      return `https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`;
    }

    function vectorTileOptions(tileClass) {
      const options = {
        maxNativeZoom: 20,
        maxZoom: 21,
        className: `vector-base-tiles ${tileClass}`,
      };
      if (!state.tileCache.baseUrl) {
        options.subdomains = 'abcd';
      }
      return options;
    }

    function createVectorLayer(themeName) {
      const lightMode = themeName === 'light';
      const baseStyle = lightMode ? 'light_nolabels' : 'dark_nolabels';
      const labelStyle = lightMode ? 'light_only_labels' : 'dark_only_labels';
      const tileClass = lightMode ? 'vector-light' : 'vector-dark';
      const baseUrl = proxyTileUrl('carto', baseStyle) || remoteCartoUrl(baseStyle);
      const labelUrl = proxyTileUrl('carto', labelStyle) || remoteCartoUrl(labelStyle);
      return L.layerGroup([
        buildTileLayer(
          baseUrl,
          'vector',
          vectorTileOptions(tileClass)
        ),
        buildTileLayer(
          labelUrl,
          'vector',
          {
            maxNativeZoom: 20,
            maxZoom: 21,
            className: `vector-label-tiles ${tileClass}`,
            ...(state.tileCache.baseUrl ? {} : { subdomains: 'abcd' }),
          }
        ),
      ]);
    }

    function createSatelliteLayer() {
      return buildTileLayer(
        proxyTileUrl('esri', 'world-imagery', 'jpg') ||
          'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        'satellite',
        { maxNativeZoom: 19, maxZoom: 21 }
      );
    }

    function rebuildVectorLayer(themeName) {
      const shouldShowVector = !satelliteLayer || state.currentLayer === 'vector' || map.hasLayer(vectorLayer);
      if (vectorLayer && map.hasLayer(vectorLayer)) {
        map.removeLayer(vectorLayer);
      }
      vectorLayer = createVectorLayer(themeName);
      if (shouldShowVector && state.currentLayer !== 'satellite') {
        vectorLayer.addTo(map);
      }
    }

    function rebuildSatelliteLayer() {
      const shouldShowSatellite = satelliteLayer && (state.currentLayer === 'satellite' || map.hasLayer(satelliteLayer));
      if (satelliteLayer && map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
      }
      satelliteLayer = createSatelliteLayer();
      if (shouldShowSatellite) {
        satelliteLayer.addTo(map);
      }
    }

    function trimTrail(points, limit = 40) {
      const normalized = mergeUniquePoints(points);
      return normalized.slice(-limit);
    }

    function upsertContact(data) {
      if (!data || !data.contact_id) {
        return;
      }
      const latlng = [data.latitude, data.longitude];
      const trailPoints = trimTrail((data.trail_points || []).concat([latlng]), state.contactTrailLimit);
      let entry = state.contacts.get(data.contact_id);
      if (!entry) {
        const marker = L.marker(latlng, {
          interactive: true,
          icon: contactIcon(data),
        });
        marker.bindTooltip(contactTooltip(data), { direction: 'top', opacity: 0.92 });
        const trail = L.polyline(trailPoints, {
          color: contactColor(data),
          weight: 2,
          opacity: 0.35,
          lineCap: 'round',
          lineJoin: 'round',
        });
        contactGroup.addLayer(trail);
        contactGroup.addLayer(marker);
        entry = { marker, trail };
        state.contacts.set(data.contact_id, entry);
      } else {
        entry.marker.setLatLng(latlng);
        entry.marker.setIcon(contactIcon(data));
        entry.marker.setTooltipContent(contactTooltip(data));
        entry.trail.setStyle({ color: contactColor(data) });
        entry.trail.setLatLngs(trailPoints);
      }
    }

    function ownVehicleLatLng() {
      if (vehicleMarker && map.hasLayer(vehicleMarker)) {
        return vehicleMarker.getLatLng();
      }
      const own = state.contacts.get('own-siha');
      if (own) {
        return own.marker.getLatLng();
      }
      return null;
    }

    function removeContact(contactId) {
      if (!state.contacts.has(contactId)) {
        return;
      }
      const entry = state.contacts.get(contactId);
      contactGroup.removeLayer(entry.marker);
      contactGroup.removeLayer(entry.trail);
      state.contacts.delete(contactId);
    }

    function ensureVehicleLayers() {
      if (contactGroup && !map.hasLayer(contactGroup)) {
        contactGroup.addTo(map);
      }
      state.contacts.forEach((entry) => {
        if (entry.trail && !contactGroup.hasLayer(entry.trail)) {
          contactGroup.addLayer(entry.trail);
        }
        if (entry.marker && !contactGroup.hasLayer(entry.marker)) {
          contactGroup.addLayer(entry.marker);
        }
      });
      if (trailLine && !map.hasLayer(trailLine)) {
        trailLine.addTo(map);
      }
    }

    function updatePointRowNumbers(container) {
      const routeRows = container.id === 'route-point-list';
      container.querySelectorAll('.point-list-row').forEach((row, index) => {
        const order = row.querySelector('.point-order');
        if (order) {
          order.textContent = routeRows ? String(index + 1) : '--';
        }
      });

    function installPointListReordering(container) {
      let draggedRow = null;

      container.querySelectorAll('.point-list-row').forEach((row) => {
        const handle = row.querySelector('.point-drag-handle');
        handle.title = state.ui.pointList.dragHint;
        handle.setAttribute('aria-label', state.ui.pointList.dragHint);
        handle.addEventListener('click', (event) => event.stopPropagation());
        handle.addEventListener('dragstart', (event) => {
          draggedRow = row;
          event.dataTransfer.effectAllowed = 'move';
          event.dataTransfer.setData('text/plain', row.dataset.overlayId);
          window.requestAnimationFrame(() => row.classList.add('is-dragging'));
        });
        handle.addEventListener('dragend', () => {
          row.classList.remove('is-dragging');
          draggedRow = null;
          updatePointRowNumbers(container);
        });
        handle.addEventListener('keydown', (event) => {
          if (!['ArrowUp', 'ArrowDown'].includes(event.key)) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          const sibling = event.key === 'ArrowUp'
            ? row.previousElementSibling
            : row.nextElementSibling;
          if (!sibling || !sibling.classList.contains('point-list-row')) {
            return;
          }
          if (event.key === 'ArrowUp') {
            container.insertBefore(row, sibling);
          } else {
            container.insertBefore(sibling, row);
          }
          updatePointRowNumbers(container);
          handle.focus();
        });
      });

      container.addEventListener('dragover', (event) => {
        if (!draggedRow || draggedRow.parentElement !== container) {
          return;
        }
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        const target = event.target.closest('.point-list-row');
        if (!target || target === draggedRow || target.parentElement !== container) {
          return;
        }
        const insertAfter = event.clientY > target.getBoundingClientRect().top
          + target.getBoundingClientRect().height / 2;
        container.insertBefore(
          draggedRow,
          insertAfter ? target.nextElementSibling : target,
        );
        updatePointRowNumbers(container);
      });
      container.addEventListener('drop', (event) => {
        if (!draggedRow || draggedRow.parentElement !== container) {
          return;
        }
        event.preventDefault();
        draggedRow.classList.remove('is-dragging');
        draggedRow = null;
        updatePointRowNumbers(container);
      });
    }

    function renderPointRows(containerId, layers, routeRows) {
