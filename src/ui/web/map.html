      if (!layers.length) {
        container.innerHTML = '<div class="stat-chip">BOS <strong>--</strong></div>';

      }
      container.innerHTML = layers.map((layer, index) => {
        const type = layer.overlayData.overlay_type;
        const radius = layer instanceof L.Circle ? Math.round(layer.getRadius()) : '';
        const order = routeRows ? (layer.overlayData.metadata?.route_order || index + 1) : '';
        const altitude = altitudeForLayer(layer);
        const choices = routeRows
          ? typeOptions([...ROUTE_TYPES], type)
          : typeOptions(layer instanceof L.Circle ? ['hss'] : ['no_fly', 'safe_zone'], type);
        return `
          <div class="point-list-row" data-overlay-id="${layer.overlayData.overlay_id}">
            <span class="point-drag-handle" draggable="true" role="button" tabindex="0">
              <svg viewBox="0 0 12 18" aria-hidden="true">
                <circle cx="3" cy="3" r="1.2"/><circle cx="9" cy="3" r="1.2"/>
                <circle cx="3" cy="9" r="1.2"/><circle cx="9" cy="9" r="1.2"/>
                <circle cx="3" cy="15" r="1.2"/><circle cx="9" cy="15" r="1.2"/>
              </svg>
            </span>
            <strong class="point-order">${routeRows ? order : '--'}</strong>
            <select data-field="type">${choices}</select>
            <input data-field="radius" type="number" min="5" max="1000" value="${radius}" ${layer instanceof L.Circle ? '' : 'disabled'}>
            <input data-field="altitude" aria-label="Irtifa (m)" title="Irtifa (m)" type="number" min="0" max="10000" value="${altitude ?? ''}" ${routeRows && ALTITUDE_TYPES.has(type) ? '' : 'disabled'}>
          </div>

      }).join('');
      installPointListReordering(container);
      updatePointRowNumbers(container);

    function commitPointListOrder(containerId) {
      const orderedIds = Array.from(
        document.querySelectorAll(`#${containerId} .point-list-row`),
        (row) => row.dataset.overlayId,
      );
      if (!orderedIds.length) {
        return;
      }
      const reordered = new Set(orderedIds);
      let nextIndex = 0;
      state.overlayOrder = orderedOverlayIds().map((overlayId) => (
        reordered.has(overlayId) ? orderedIds[nextIndex++] : overlayId
      ));

    function applyMissionDialog() {
      emitAction({ type: 'history_batch_begin', label: 'mission-list' });
      const routeOrders = new Map(
        Array.from(
          document.querySelectorAll('#route-point-list .point-list-row'),
          (row, index) => [row.dataset.overlayId, index + 1],
        ),
      );
      commitPointListOrder('route-point-list');
      commitPointListOrder('free-point-list');
      document.querySelectorAll('.point-list-row').forEach((row) => {
        const layer = state.layers.get(row.dataset.overlayId);
        if (!layer || !isArchivableLayer(layer)) {
          return;
        }
        const type = row.querySelector('[data-field="type"]').value;
        const radius = Number(row.querySelector('[data-field="radius"]').value || radiusFor(type));
        const altitudeInput = row.querySelector('[data-field="altitude"]');
        const order = routeOrders.get(row.dataset.overlayId) || 999;
        const requestedAltitude = altitudeInput.value.trim() === '' ? NaN : Number(altitudeInput.value);
        layer.overlayData.overlay_type = type;
        layer.overlayData.color = colorFor(type);
        layer.overlayData.label = POINT_TYPES.has(type) ? labelForPoint(type, order) : inferLabel(type);
        layer.overlayData.altitude_m = ALTITUDE_TYPES.has(type)
          ? (Number.isFinite(requestedAltitude) && requestedAltitude >= 0
            ? requestedAltitude
            : defaultAltitudeFor(type))
          : null;
        layer.overlayData.metadata = {
          ...(layer.overlayData.metadata || {}),
          route_order: ROUTE_TYPES.has(type) ? order : null,
          independent: !ROUTE_TYPES.has(type),
          keep_inside: type === 'safe_zone',
        };
        if (layer instanceof L.Circle) {
          layer.setRadius(radius);
        }
        setLayerVisual(layer, state.selectedId === layer.overlayData.overlay_id);
        emitOverlay(layer);
      });
      refreshMissionRoute();
      hideDialogs();
      emitAction({ type: 'history_batch_end' });
    }

    function bindHistoryShortcuts() {
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        const editingText = target && (
          target.matches?.('input, textarea, select')
          || target.isContentEditable
        );
        if (
          editingText
          || event.altKey
          || !(event.ctrlKey || event.metaKey)
          || String(event.key).toLowerCase() !== 'z'
        ) {
          return;
        }
        event.preventDefault();
        event.stopPropagation();
        emitAction({
          type: event.shiftKey ? 'history_redo' : 'history_undo',
        });
      }, true);
    }

    function createVehicleMarker() {
      return L.marker([0, 0], {
        interactive: false,
        icon: L.divIcon({
          className: 'vehicle-icon',
          html: `<div class="aircraft-icon" style="--aircraft-color:var(--accent)">${aircraftSvg()}</div>`,
          iconSize: [31, 31],
          iconAnchor: [15, 15],
        }),
      });
    }

    function bindDialogEvents() {
      const pointDialog = document.getElementById('point-dialog');
      pointDialog.addEventListener('click', (event) => {
        const action = event.target.dataset.pointAction;
        if (!action) {
          return;
        }
        if (action === 'cancel') {
          hideDialogs();
        }
        if (action === 'apply') {
          applyPointDialog();
        }
      });

      document.getElementById('point-type-input').addEventListener('change', (event) => {
        const type = event.target.value;
        const orderInput = document.getElementById('point-order-input');
        const radiusInput = document.getElementById('point-radius-input');
        const altitudeInput = document.getElementById('point-altitude-input');
        orderInput.disabled = !ROUTE_TYPES.has(type);
        altitudeInput.disabled = !ALTITUDE_TYPES.has(type);
        if (ALTITUDE_TYPES.has(type) && altitudeInput.value === '') {
          altitudeInput.value = defaultAltitudeFor(type);
        }
        if (!radiusInput.value) {
          radiusInput.value = radiusFor(type);
        }
      });

      const missionDialog = document.getElementById('mission-dialog');
      missionDialog.addEventListener('change', (event) => {
        if (event.target.dataset.field !== 'type') {
          return;
        }
        const row = event.target.closest('.point-list-row');
        if (!row) {
          return;
        }
        const type = event.target.value;
        const altitudeInput = row.querySelector('[data-field="altitude"]');
        altitudeInput.disabled = !ALTITUDE_TYPES.has(type);
        if (ALTITUDE_TYPES.has(type) && altitudeInput.value.trim() === '') {
          altitudeInput.value = defaultAltitudeFor(type);
        }
      });
      missionDialog.addEventListener('click', (event) => {
        const action = event.target.dataset.missionAction;
        const row = event.target.closest('.point-list-row');
        if (row && !action && !event.target.closest('.point-drag-handle')) {
          selectOverlay(row.dataset.overlayId);
        }
        if (!action) {
          return;
        }
        if (action === 'cancel') {
          hideDialogs();
        }
        if (action === 'apply') {
          applyMissionDialog();
        }
        if (action === 'clear') {
          clearAllLocal();
          emitAction({ type: 'tool_changed', tool: 'clear' });
        }
      });
    }

    function init() {
      map = L.map('map', {
        editable: true,
        zoomControl: false,
        doubleClickZoom: false,
        attributionControl: false,
        preferCanvas: true,
        renderer: L.canvas({ padding: 0.2 }),
        maxZoom: 21,
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,
        inertia: false,
      }).setView([39.8672, 32.7481], 15);
      installMiddleButtonMapPan();

      vectorLayer = createVectorLayer(state.themeName);
      satelliteLayer = createSatelliteLayer();
      if (state.currentLayer === 'satellite') {
        satelliteLayer.addTo(map);
      } else {
        vectorLayer.addTo(map);
      }

      safeMaskGroup = L.layerGroup().addTo(map);
      overlayGroup = L.featureGroup().addTo(map);
      missionRouteLine = L.polyline([], {
        color: '#95f089',
        weight: 2.4,
        opacity: 0.82,
        lineCap: 'round',
        lineJoin: 'round',
      }).addTo(map);
      rtlReturnLine = L.polyline([], {
        color: colorFor('rtl'),
        weight: 2.2,
        opacity: 0.88,
        dashArray: '7 6',
        lineCap: 'round',
        lineJoin: 'round',
        interactive: false,
      }).addTo(map);
      labelGroup = L.layerGroup().addTo(map);
      contactGroup = L.layerGroup().addTo(map);
      trailLine = L.polyline([], {
        color: '#61a8ff',
        weight: 2.2,
        opacity: 0.56,
        lineCap: 'round',
        lineJoin: 'round',
      }).addTo(map);
      vehicleMarker = createVehicleMarker();
      homeReferenceMarker = createHomeReferenceMarker(map.getCenter()).addTo(map);

      buildLayerToggle();
      buildToolDock();
      observeToolDockSpacing();
      bindDialogEvents();
      bindHistoryShortcuts();

      map.on('mousemove', (event) => queueCursorUpdate(event.latlng));
      map.on('moveend', emitBounds);
      map.on('zoomend', emitBounds);
      map.on('resize', updateScaleReadout);

      map.on('click', (event) => {
        hideContextMenu();
        const tool = state.activeTool;
        if (tool === 'pan') {
          selectOverlay(null);
          return;
        }
        if (POINT_TYPES.has(tool)) {
          addPointOverlay(tool, event.latlng);
          return;
        }
      });

      map.on('contextmenu', (event) => {
        showContextMenu(event.containerPoint, event.latlng);
      });

      map.on('editable:drawing:commit', (event) => {
        const tool = normalizeType(state.activeTool);
        if (!event.layer || tool === 'pan') {
          return;
        }
        finishNewLayer(event.layer, tool);
      });

      document.body.addEventListener('click', (event) => {
        if (!event.target.closest('.context-menu')) {
          hideContextMenu();
        }
      });

      document.getElementById('context-menu').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        const action = button ? button.dataset.action : null;
        if (!action || !contextPoint) {
          hideContextMenu();
          return;
        }
        hideContextMenu();
        if (action === 'goto') {
          addGotoCommand(contextPoint);
        } else if (action === 'center') {
          const ownLatLng = ownVehicleLatLng();
          if (ownLatLng) {
            map.invalidateSize(false);
            map.setView(ownLatLng, Math.max(map.getZoom(), state.centerMinZoom), { animate: false });
            emitAction({ type: 'center_vehicle' });
          }
        } else if (action === 'set_home') {
          setHomeReference(contextPoint, true);
        } else if (action === 'delete' && contextOverlayId) {
          removeOverlayById(contextOverlayId, true);
        }
      });

      emitBounds();
    }

    window.ykiMap = {
      setUiConfig(config) {
        state.ui = {
          layers: config.layers || state.ui.layers,
          missionMode: config.missionMode || state.ui.missionMode,
          pointList: config.pointList || state.ui.pointList,
          tools: config.tools || state.ui.tools,
          context: config.context || state.ui.context,
          primaryTools: config.toolOrder?.primary || state.ui.primaryTools || PRIMARY_TOOLS,
          transferTools: config.toolOrder?.transfer || state.ui.transferTools || TRANSFER_TOOLS,
        };
        if (Array.isArray(config.missionTypes)) {
          ROUTE_TYPES.clear();
          POINT_TYPES.clear();
          POLYGON_TYPES.clear();
          EDITABLE_POINT_TYPES.splice(0, EDITABLE_POINT_TYPES.length);
          config.missionTypes.forEach((item) => {
            if (item.route) ROUTE_TYPES.add(item.key);
            if (item.geometry === 'point') POINT_TYPES.add(item.key);
            if (item.geometry === 'polygon') POLYGON_TYPES.add(item.key);
            if (item.geometry === 'point' && item.editable) EDITABLE_POINT_TYPES.push(item.key);
          });
          if (map) buildToolDock();
        }
        const previousTileBaseUrl = state.tileCache.baseUrl;
        state.tileCache = {
          ...state.tileCache,
          ...(config.tileCache || {}),
        };
        if (config.currentLayer) {
          state.currentLayer = config.currentLayer;
        }
        if (typeof config.missionLoop === 'boolean') {
          state.missionLoop = config.missionLoop;
          syncMissionModeState();
        }
        const defaults = config.missionDefaults || {};
        state.defaultRadii = { ...state.defaultRadii, ...(defaults.radii || {}) };
        state.defaultAltitude = Number(defaults.defaultAltitude || state.defaultAltitude);
        state.centerMinZoom = Number(defaults.centerMinZoom || state.centerMinZoom);
        state.vehicleTrailLimit = Number(defaults.vehicleTrailLimit || state.vehicleTrailLimit);
        state.contactTrailLimit = Number(defaults.contactTrailLimit || state.contactTrailLimit);
        const theme = config.theme || {};
        const nextThemeName = theme.name || state.themeName;
        applyTheme(theme);
        const tileCacheChanged = map && previousTileBaseUrl !== state.tileCache.baseUrl;
        if (map && (nextThemeName !== state.themeName || tileCacheChanged)) {
          state.themeName = nextThemeName;
          rebuildVectorLayer(state.themeName);
          rebuildSatelliteLayer();
          syncLayerState();
          window.setTimeout(emitBounds, 0);
        } else {
          state.themeName = nextThemeName;
        }
        setToolbarTitles();
      },

      setBaseLayer(layer) {
        state.currentLayer = layer || 'vector';
        syncLayerState();
        if (state.currentLayer === 'satellite') {
          if (map.hasLayer(vectorLayer)) {
            map.removeLayer(vectorLayer);
          }
          if (!map.hasLayer(satelliteLayer)) {
            satelliteLayer.addTo(map);
          }
        } else {
          if (map.hasLayer(satelliteLayer)) {
            map.removeLayer(satelliteLayer);
          }
          if (!map.hasLayer(vectorLayer)) {
            vectorLayer.addTo(map);
          }
        }
        window.setTimeout(emitBounds, 0);
      },

      setMissionLoop(loop) {
        state.missionLoop = Boolean(loop);
        syncMissionModeState();
        refreshMissionRoute();
      },

      setActiveTool(tool) {
        state.activeTool = tool || 'pan';
        syncToolState();
        map.editTools.stopDrawing();
        if (['safe_zone', 'no_fly'].includes(state.activeTool)) {
          startShapeTool(state.activeTool);
        }
      },

      setOverlays(items) {
        orderedOverlayIds().forEach((overlayId) => removeOverlayById(overlayId, false));
        state.overlayOrder = [];
        (items || []).forEach((item) => upsertOverlay(item));
      },

      applyStateDelta(delta) {
        const changes = delta || {};
        (changes.removeOverlays || []).forEach((overlayId) => {
          removeOverlayById(overlayId, false);
        });
        (changes.upsertOverlays || []).forEach((item) => {
          upsertOverlay(item);
        });
        (changes.removeContacts || []).forEach((contactId) => {
          removeContact(contactId);
        });
        (changes.upsertContacts || []).forEach((contact) => {
          upsertContact(contact);
        });
        if (Array.isArray(changes.overlayOrder)) {
          setOverlayOrder(changes.overlayOrder);
        }
      },

      upsertOverlay(data) {
        upsertOverlay(data);
      },

      removeOverlayById(id, shouldNotify = false) {
        removeOverlayById(id, shouldNotify);
      },

      setOverlayOrder(order) {
        setOverlayOrder(order);
      },

      setSelectedOverlay(id) {
        selectOverlay(id || null);
      },

      setCacheCount(count) {
        document.querySelector('#cache-chip strong').textContent = String(count || 0);
      },

      setCommandAvailable(available) {
        state.commandAvailable = Boolean(available);
        const button = document.querySelector('#tool-dock .tool-button[data-tool="send"]');
        if (button) {
          const transferPending = document.getElementById('transfer-chip').dataset.state === 'pending';
          button.disabled = !state.commandAvailable || transferPending;
          const title = state.ui.tools.send || TOOL_DEFAULTS.send;
          button.title = state.commandAvailable
            ? title
            : `${title} — uçuş cihazı bağlı değil`;
        }
      },

      setMissionTransferState(status, message) {
        const normalized = ['pending', 'success', 'danger', 'dirty'].includes(status) ? status : 'idle';
        const chip = document.getElementById('transfer-chip');
        const labels = {
          pending: 'GÖNDERİLİYOR',
          dirty: 'GÖNDERİLMEDİ',
          success: 'ONAYLANDI',
          danger: 'REDDEDİLDİ',
          idle: '--',
        };
        chip.hidden = normalized === 'idle';
        chip.dataset.state = normalized;
        chip.querySelector('strong').textContent = labels[normalized];
        chip.title = message || '';
        const button = document.querySelector('#tool-dock .tool-button[data-tool="send"]');
        if (button) {
          button.classList.remove('is-pending', 'is-success', 'is-danger', 'is-dirty');
          if (normalized !== 'idle') {
            button.classList.add(`is-${normalized}`);
          }
          button.disabled = !state.commandAvailable || normalized === 'pending';
          button.title = message || state.ui.tools.send || TOOL_DEFAULTS.send;
        }
      },

      upsertContact(data) {
        upsertContact(data);
      },

      removeContact(contactId) {
        removeContact(contactId);
      },

      clearAllLocal() {
        clearAllLocal();
      },

      prepareHomeHistoryReference(latitude, longitude) {
        if (!homeReferenceMarker || state.homeReferencePending) {
          return false;
        }
        const lat = Number(latitude);
        const lon = Number(longitude);
        if (
          !Number.isFinite(lat)
          || !Number.isFinite(lon)
          || lat < -90
          || lat > 90
          || lon < -180
          || lon > 180
        ) {
          return false;
        }
        const previous = homeReferenceMarker.getLatLng();
        state.homeReferenceRollbackLatLng = L.latLng(
          previous.lat,
          previous.lng,
        );
        state.homeReferenceCommandedLatLng = null;
        state.homeReferencePending = true;
        state.homeReferencePendingUntil = Date.now() + 15000;
        if (homeReferenceMarker.dragging) {
          homeReferenceMarker.dragging.disable();
        }
        setHomeReference(L.latLng(lat, lon), false);
        emitAction({
          type: 'history_home_command',
          lat,
          lon,
        });
        return true;
      },

      resolveHomeReference(success, latitude = null, longitude = null) {
        if (!homeReferenceMarker) {
          return;
        }
        if (homeReferenceMarker.dragging) {
          homeReferenceMarker.dragging.enable();
        }
        if (success) {
          const accepted = homeReferenceMarker.getLatLng();
          state.homeReferencePending = false;
          state.homeReferencePendingUntil = 0;
          state.homeReferenceRollbackLatLng = null;
          state.homeReferenceCommandedLatLng = L.latLng(
            accepted.lat,
            accepted.lng,
          );
          if (map && !map.hasLayer(homeReferenceMarker)) {
            homeReferenceMarker.addTo(map);
          }
          return;
        }
        state.homeReferencePending = false;
        state.homeReferencePendingUntil = 0;
        state.homeReferenceCommandedLatLng = null;
        const hasFallback = (
          latitude !== null
          && latitude !== undefined
          && longitude !== null
          && longitude !== undefined
          && String(latitude).trim() !== ''
          && String(longitude).trim() !== ''
        );
        const lat = hasFallback ? Number(latitude) : Number.NaN;
        const lon = hasFallback ? Number(longitude) : Number.NaN;
        const fallbackIsValid = (
          Number.isFinite(lat)
          && Number.isFinite(lon)
          && lat >= -90
          && lat <= 90
          && lon >= -180
          && lon <= 180
        );
        const restorePosition = fallbackIsValid
          ? L.latLng(lat, lon)
          : state.homeReferenceRollbackLatLng;
        state.homeReferenceRollbackLatLng = null;
        if (restorePosition) {
          setHomeReference(restorePosition, false);
        } else if (map && !map.hasLayer(homeReferenceMarker)) {
          homeReferenceMarker.addTo(map);
        }
      },

      pushTelemetry(payload) {
        if (payload && Object.prototype.hasOwnProperty.call(payload, 'commandAvailable')) {
          window.ykiMap.setCommandAvailable(payload.commandAvailable);
        }
        updateGpsSummary(payload || {});
        updateHomeReference(payload || {});
        const localReadout = document.querySelector('#local-readout');
        const localNorth = Number(payload && payload.localNorth);
        const localEast = Number(payload && payload.localEast);
        const localDown = Number(payload && payload.localDown);
        let localReadoutText;
        if (
          payload
          && payload.localPositionAvailable
          && Number.isFinite(localNorth)
          && Number.isFinite(localEast)
          && Number.isFinite(localDown)
        ) {
          const signed = (value) => `${value >= 0 ? '+' : ''}${value.toFixed(1)}`;
          localReadoutText = `LOCAL NED <strong>N ${signed(localNorth)} · E ${signed(localEast)} · D ${signed(localDown)} m</strong>`;
        } else {
          localReadoutText = 'LOCAL NED <strong>N -- · E -- · D -- m</strong>';
        }
        if (state.telemetryDisplay.localReadout !== localReadoutText) {
          state.telemetryDisplay.localReadout = localReadoutText;
          localReadout.innerHTML = localReadoutText;
        }
        if (!payload || !payload.active) {
          if (vehicleMarker && map.hasLayer(vehicleMarker)) {
            map.removeLayer(vehicleMarker);
          }
          if (trailLine.getLatLngs().length) {
            trailLine.setLatLngs([]);
          }
          state.initialCentered = false;
          state.lastVehicleLatLng = null;
          state.telemetryDisplay.heading = null;
          const emptyReadout = 'UAV LAT <strong>--</strong> LON <strong>--</strong>';
          if (state.telemetryDisplay.vehicleReadout !== emptyReadout) {
            state.telemetryDisplay.vehicleReadout = emptyReadout;
            document.querySelector('#vehicle-readout').innerHTML = emptyReadout;
          }
          return;
        }
        const latitude = Number(payload.lat);
        const longitude = Number(payload.lon);
        if (
          !payload.positionValid
          || !Number.isFinite(latitude)
          || !Number.isFinite(longitude)
          || latitude < -90
          || latitude > 90
          || longitude < -180
          || longitude > 180
        ) {
          return;
        }
        const latlng = L.latLng(latitude, longitude);
        if (!state.homeReferenceInitialized && !state.homeReferencePending) {
          setHomeReference(latlng, false);
        }
        if (payload.resetTrack) {
          trailLine.setLatLngs([]);
          state.lastVehicleLatLng = null;
          state.initialCentered = false;
        }
        if (!map.hasLayer(vehicleMarker)) {
          vehicleMarker.addTo(map);
        }
        const markerPosition = vehicleMarker.getLatLng();
        if (markerPosition.lat !== latitude || markerPosition.lng !== longitude) {
          vehicleMarker.setLatLng(latlng);
        }
        const heading = Number(payload.heading) || 0;
        if (state.telemetryDisplay.heading !== heading) {
          state.telemetryDisplay.heading = heading;
          const markerElement = vehicleMarker.getElement();
          const aircraftElement = markerElement
            ? markerElement.querySelector('.aircraft-icon')
            : null;
          if (aircraftElement) {
            aircraftElement.style.transform = `rotate(${heading}deg)`;
          }
        }
        if (!state.lastVehicleLatLng || state.lastVehicleLatLng.distanceTo(latlng) >= 0.25) {
          trailLine.setLatLngs(trimTrail(trailLine.getLatLngs().concat([latlng]), state.vehicleTrailLimit));
          state.lastVehicleLatLng = latlng;
        }
        const vehicleReadout = `UAV LAT <strong>${latitude.toFixed(5)}</strong> LON <strong>${longitude.toFixed(5)}</strong>`;
        if (state.telemetryDisplay.vehicleReadout !== vehicleReadout) {
          state.telemetryDisplay.vehicleReadout = vehicleReadout;
          document.querySelector('#vehicle-readout').innerHTML = vehicleReadout;
        }
        if (!state.initialCentered) {
          map.setView(latlng, Math.max(map.getZoom(), state.centerMinZoom));
          state.initialCentered = true;
        }
      },
    };

    function bootMap(initialConfig) {
      if (initialConfig) {
        window.ykiMap.setUiConfig(initialConfig);
      }
      init();
      if (bridge && bridge.jsReady) {
        bridge.jsReady();
      }
    }

    if (typeof qt !== 'undefined' && qt.webChannelTransport && typeof QWebChannel !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, (channel) => {
        bridge = channel.objects.qtBridge;
        if (bridge && bridge.initialConfig) {
          bridge.initialConfig((payload) => {
            let config = null;
            try {
              config = payload ? JSON.parse(payload) : null;
            } catch (_error) {
              config = null;
            }
            bootMap(config);
          });
        } else {
          bootMap(null);
        }
      });
    } else {
      // Standalone browser smoke tests can exercise the exact production map
      // without a PyQt WebChannel host.
      bootMap(null);
    }
  </script>
</body>
</html>
