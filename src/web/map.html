<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuzey Map</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <style>
    :root {
      --bg: #1e1e1e;
      --surface: rgba(37, 37, 38, 0.96);
      --surface-alt: rgba(45, 45, 48, 0.98);
      --surface-hover: rgba(42, 45, 46, 0.98);
      --border: rgba(49, 49, 49, 0.98);
      --border-strong: rgba(63, 63, 70, 0.98);
      --text: #cccccc;
      --muted: #8b949e;
      --accent: #0e639c;
      --accent-dim: rgba(9, 71, 113, 0.88);
      --success: #6a9955;
      --warning: #cca700;
      --danger: #f44747;
      --info: #3794ff;
    }

    html, body, #map-shell, #map {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans", sans-serif;
    }

    #map-shell {
      position: relative;
      isolation: isolate;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: var(--bg);
    }

    .leaflet-control-attribution {
      display: none;
    }

    .leaflet-control-scale {
      margin: 0 0 14px 14px !important;
    }

    .leaflet-control-scale-line {
      background: rgba(13, 17, 22, 0.82);
      border: 1px solid var(--border);
      border-top: none;
      color: var(--text);
      font-size: 10px;
      line-height: 1.1;
    }

    .vector-base-tiles.vector-dark {
      filter: brightness(1.42) contrast(0.98) saturate(0.78);
    }

    .vector-label-tiles.vector-dark {
      filter: brightness(1.32) contrast(1.05) saturate(0.78);
      opacity: 0.98;
    }

    .vector-base-tiles.vector-light {
      filter: brightness(0.98) contrast(0.96) saturate(0.92);
    }

    .vector-label-tiles.vector-light {
      filter: contrast(1.02) saturate(0.94);
      opacity: 0.96;
    }

    .leaflet-div-icon {
      background: transparent;
      border: none;
    }

    .leaflet-vertex-icon,
    .leaflet-div-icon.leaflet-editing-icon {
      width: 10px !important;
      height: 10px !important;
      margin-left: -5px !important;
      margin-top: -5px !important;
      border: 1px solid var(--text) !important;
      border-radius: 2px !important;
      background: var(--surface-alt) !important;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .map-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 900;
    }

    .floating-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
    }

    .map-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 940;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .map-stats {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .map-top > * {
      pointer-events: auto;
    }

    .stat-chip {
      padding: 5px 8px;
      border-radius: 3px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--muted);
    }

    .stat-chip strong {
      color: var(--text);
      margin-left: 6px;
    }

    .layer-toggle button,
    .tool-button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--muted);
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }

    .layer-toggle {
      display: inline-flex;
      gap: 0;
      overflow: hidden;
      border-radius: 4px;
    }

    .layer-toggle button {
      min-width: 82px;
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 0;
    }

    .layer-toggle button + button {
      border-left: none;
    }

    .layer-toggle button.active,
    .tool-button.active {
      color: var(--text);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .tool-dock {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 950;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
    }

    .tool-button {
      width: 34px;
      height: 34px;
      border-radius: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .tool-button.is-utility {
      border-color: var(--border-strong);
    }

    .tool-button.is-danger {
      color: var(--danger);
      border-color: rgba(244, 71, 71, 0.45);
    }

    .tool-button.is-send {
      color: var(--success);
      background: rgba(106, 153, 85, 0.14);
      border-color: rgba(106, 153, 85, 0.62);
    }

    .tool-button:hover,
    .layer-toggle button:hover,
    .context-menu button:hover {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .tool-button.is-send:hover {
      color: #f4fff2;
      background: rgba(106, 153, 85, 0.28);
      border-color: var(--success);
    }

    .tool-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hud-footer {
      position: absolute;
      left: 12px;
      bottom: 14px;
      pointer-events: none;
      z-index: 930;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      background: rgba(30, 30, 30, 0.88);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      color: var(--muted);
    }

    .hud-footer strong {
      color: var(--text);
      font-weight: 700;
    }

    .context-menu {
      position: absolute;
      z-index: 980;
      display: none;
      min-width: 180px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
      pointer-events: auto;
    }

    .context-menu button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: var(--text);
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }

    .marker-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      background: rgba(11, 15, 21, 0.94);
      border: 2px solid var(--marker-color, var(--accent));
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
      color: var(--marker-color, var(--accent));
    }

    .marker-icon.selected {
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 0 0 4px rgba(88, 166, 255, 0.18);
    }

    .marker-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .aircraft-icon {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: var(--aircraft-color, var(--accent));
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.55));
    }

    .aircraft-icon svg {
      width: 31px;
      height: 31px;
    }

    .aircraft-icon .airframe {
      fill: rgba(8, 12, 18, 0.22);
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linejoin: round;
    }

    .aircraft-icon .spine,
    .aircraft-icon .wing {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .overlay-label {
      display: inline-flex;
      align-items: center;
      min-height: 20px;
      padding: 0 8px;
      background: rgba(11, 15, 21, 0.9);
      border: 1px solid var(--label-color, var(--border));
      border-radius: 6px;
      color: var(--text);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .overlay-label.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(97, 168, 255, 0.12);
    }

    .hud-footer {
      top: 54px;
      bottom: auto;
    }

    .map-dialog {
      position: absolute;
      z-index: 990;
      display: none;
      width: min(420px, calc(100% - 36px));
      max-height: calc(100% - 96px);
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      pointer-events: auto;
    }

    .map-dialog.small {
      width: 300px;
    }

    .map-dialog header,
    .map-dialog footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
    }

    .map-dialog footer {
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      border-bottom: none;
    }

    .map-dialog h3 {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.3px;
      flex: 1;
    }

    .map-dialog .dialog-body {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .map-dialog label {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .map-dialog input,
    .map-dialog select {
      min-height: 28px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 8px;
    }

    .map-dialog button {
      min-height: 28px;
      background: var(--surface-alt);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .map-dialog button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .map-dialog button.danger {
      color: var(--danger);
      border-color: rgba(244, 71, 71, 0.55);
    }

    .point-list {
      display: grid;
      gap: 6px;
      max-height: 260px;
      overflow: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .point-list::-webkit-scrollbar,
    .map-dialog::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    .point-list::-webkit-scrollbar-track,
    .map-dialog::-webkit-scrollbar-track {
      background: transparent;
    }

    .point-list::-webkit-scrollbar-thumb,
    .map-dialog::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border: 2px solid var(--surface);
      border-radius: 999px;
    }

    .point-list::-webkit-scrollbar-thumb:hover,
    .map-dialog::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    .point-list-row {
      display: grid;
      grid-template-columns: 40px 1fr 74px 74px;
      gap: 6px;
      align-items: center;
      padding: 6px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .point-list-row:hover {
      border-color: var(--accent);
      background: rgba(14, 99, 156, 0.14);
    }

    .point-list-row strong {
      font-size: 11px;
    }

    .list-section-title {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="map-shell">
    <div id="map"></div>
    <div class="map-overlay">
      <div class="map-top">
        <div class="map-stats">
          <div class="stat-chip" id="mission-chip">MISSION <strong>0</strong></div>
          <div class="stat-chip" id="selection-chip">SELECTED <strong>--</strong></div>
          <div class="stat-chip" id="cache-chip">CACHE <strong>0</strong></div>
        </div>
        <div class="floating-bar layer-toggle" id="layer-toggle"></div>
      </div>
      <div class="tool-dock" id="tool-dock"></div>
      <div class="hud-footer">
        <span id="cursor-readout">LAT <strong>0.00000</strong> LON <strong>0.00000</strong></span>
        <span id="zoom-readout">ZOOM <strong>0</strong></span>
      </div>
      <div id="context-menu" class="context-menu">
        <button data-action="goto"></button>
        <button data-action="takeoff"></button>
        <button data-action="waypoint"></button>
        <button data-action="loiter"></button>
        <button data-action="land"></button>
        <button data-action="center"></button>
        <button data-action="delete"></button>
      </div>
      <div id="point-dialog" class="map-dialog small">
        <header><h3>NOKTA AYARLARI</h3></header>
        <div class="dialog-body">
          <label>Tip
            <select id="point-type-input"></select>
          </label>
          <label>Cap / Radius
            <input id="point-radius-input" type="number" min="5" max="1000" step="1">
          </label>
          <label>Waypoint Sirasi
            <input id="point-order-input" type="number" min="1" max="999" step="1">
          </label>
        </div>
        <footer>
          <button data-point-action="cancel">Iptal</button>
          <button class="primary" data-point-action="apply">Uygula</button>
        </footer>
      </div>
      <div id="mission-dialog" class="map-dialog">
        <header><h3>MISSION POINTS</h3></header>
        <div class="dialog-body">
          <div class="list-section-title">Rota Noktalari</div>
          <div id="route-point-list" class="point-list"></div>
          <div class="list-section-title">Bagimsiz Noktalar / Alanlar</div>
          <div id="free-point-list" class="point-list"></div>
        </div>
        <footer>
          <button class="danger" data-mission-action="clear">Temizle</button>
          <button data-mission-action="cancel">Iptal</button>
          <button class="primary" data-mission-action="apply">Kaydet</button>
        </footer>
      </div>
    </div>
  </div>

  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="./vendor/leaflet.js"></script>
  <script src="./vendor/Leaflet.Editable.js"></script>
  <script>
    const BLANK_TILE = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256"><rect width="256" height="256" fill="%230d1116"/></svg>';
    const PRIMARY_TOOLS = ['pan', 'takeoff', 'waypoint', 'loiter', 'no_fly', 'safe_zone', 'hss', 'land', 'mission_list', 'clear'];
    const TRANSFER_TOOLS = ['archive', 'send'];
    const TOOL_ORDER = [...PRIMARY_TOOLS, ...TRANSFER_TOOLS];
    const TOOL_DEFAULTS = {
      pan: 'Select',
      takeoff: 'Takeoff',
      waypoint: 'Waypoint',
      loiter: 'Loiter',
      no_fly: 'No-Fly',
      safe_zone: 'Safe Zone',
      hss: 'HSS',
      land: 'Land',
      mission_list: 'Point List',
      archive: 'Archive',
      send: 'Send',
      clear: 'Clear',
    };
    const CONTEXT_DEFAULTS = {
      goto: 'Send GOTO',
      takeoff: 'Set takeoff point',
      waypoint: 'Add waypoint',
      loiter: 'Add loiter point',
      land: 'Set land point',
      center: 'Center vehicle',
      delete: 'Delete selected',
    };
    const COLORS = {
      takeoff: '#78b7ff',
      waypoint: '#74d99f',
      loiter: '#3f9f63',
      no_fly: '#eb6464',
      safe_zone: '#73a95b',
      hss: '#eb6464',
      land: '#2f7ed8',
      goto: '#61a8ff',
    };
    const ROUTE_TYPES = new Set(['takeoff', 'waypoint', 'loiter', 'land']);
    const POINT_TYPES = new Set(['takeoff', 'waypoint', 'loiter', 'land', 'hss']);
    const EDITABLE_POINT_TYPES = ['takeoff', 'waypoint', 'loiter', 'land', 'hss'];
    const DEFAULT_RADII = { takeoff: 35, waypoint: 35, loiter: 75, land: 35, hss: 100 };

    let map;
    let bridge = null;
    let vectorLayer;
    let satelliteLayer;
    let overlayGroup;
    let safeMaskGroup;
    let labelGroup;
    let contactGroup;
    let vehicleMarker = null;
    let trailLine = null;
    let missionRouteLine = null;
    let contextPoint = null;

    const state = {
      ui: {
        layers: { vector: 'Vector', satellite: 'Satellite' },
        tools: { ...TOOL_DEFAULTS },
        context: { ...CONTEXT_DEFAULTS },
      },
      activeTool: 'pan',
      currentLayer: 'vector',
      selectedId: null,
      overlayOrder: [],
      layers: new Map(),
      labelLayers: new Map(),
      contacts: new Map(),
      safeMasks: new Map(),
      defaultRadii: { ...DEFAULT_RADII },
      centerMinZoom: 16,
      vehicleTrailLimit: 80,
      contactTrailLimit: 36,
      themeName: 'dark',
      tileCache: { enabled: true, baseUrl: '' },
      tileNotified: { vector: false, satellite: false },
      initialCentered: false,
      draggingPoint: null,
      dragMoved: false,
      suppressPointClick: false,
      lastCursor: '',
      pendingCursor: null,
      cursorFrame: 0,
    };

    function iconSvg(name) {
      const icons = {
        pan: '<svg viewBox="0 0 24 24"><path d="M7 5l5 5-5 5"/><path d="M13 5l5 5-5 5"/></svg>',
        takeoff: '<svg viewBox="0 0 24 24"><path d="M12 18V6"/><path d="M7 11l5-5 5 5"/><path d="M5 20h14"/></svg>',
        waypoint: '<svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="3.2"/><path d="M12 20l4-6.5a6 6 0 1 0-8 0z"/></svg>',
        loiter: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 6l2 2"/><path d="M18 12l-2 2"/></svg>',
        rally: '<svg viewBox="0 0 24 24"><path d="M6 20V5"/><path d="M6 6h10l-2.5 3 2.5 3H6"/></svg>',
        route: '<svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 17l4-4 2 1 4-6"/></svg>',
        survey: '<svg viewBox="0 0 24 24"><path d="M4 7l7-3 9 4-7 3z"/><path d="M4 7v9l9 4 7-4V8"/><path d="M13 10v10"/></svg>',
        no_fly: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M7 17l10-10"/></svg>',
        safe_zone: '<svg viewBox="0 0 24 24"><path d="M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z"/><path d="M8.5 12l2.3 2.3L16 9"/></svg>',
        hss: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/></svg>',
        target: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M3 12h3"/><path d="M18 12h3"/></svg>',
        land: '<svg viewBox="0 0 24 24"><path d="M12 6v12"/><path d="M7 13l5 5 5-5"/><path d="M4 20h16"/></svg>',
        mission_list: '<svg viewBox="0 0 24 24"><path d="M8 6h12"/><path d="M8 12h12"/><path d="M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
        archive: '<svg viewBox="0 0 24 24"><path d="M4 7h6l2 2h8v10H4z"/><path d="M8 14h8"/><path d="M12 10v8"/></svg>',
        send: '<svg viewBox="0 0 24 24"><path d="M4 12l16-8-5 16-3-6z"/><path d="M12 14l-3 5"/></svg>',
        clear: '<svg viewBox="0 0 24 24"><path d="M4 8h16"/><path d="M8 8V5h8v3"/><path d="M6 8l1 11h10l1-11"/></svg>',
        contact: '<svg viewBox="0 0 24 24"><path d="M4 15l8-9 8 9"/><path d="M12 6v12"/><path d="M8 17h8"/></svg>',
      };
      return icons[name] || icons.pan;
    }

    function applyTheme(theme) {
      const root = document.documentElement;
      Object.entries(theme || {}).forEach(([key, value]) => {
        const cssKey = key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
        root.style.setProperty(`--${cssKey}`, value);
      });
    }

    function setToolbarTitles() {
      document.querySelectorAll('#tool-dock .tool-button').forEach((button) => {
        const tool = button.dataset.tool;
        button.title = state.ui.tools[tool] || TOOL_DEFAULTS[tool];
      });
      document.querySelectorAll('#context-menu button').forEach((button) => {
        const action = button.dataset.action;
        button.textContent = state.ui.context[action] || CONTEXT_DEFAULTS[action];
      });
      document.querySelectorAll('#layer-toggle button').forEach((button) => {
        const layer = button.dataset.layer;
        button.textContent = state.ui.layers[layer] || layer.toUpperCase();
      });
    }

    function buildLayerToggle() {
      const container = document.getElementById('layer-toggle');
      container.innerHTML = '';
      ['vector', 'satellite'].forEach((layer) => {
        const button = document.createElement('button');
        button.dataset.layer = layer;
        button.addEventListener('click', () => {
          window.kuzeyMap.setBaseLayer(layer);
          emitAction({ type: 'layer_changed', layer });
        });
        container.appendChild(button);
      });
      syncLayerState();
      setToolbarTitles();
    }

    function buildToolDock() {
      const container = document.getElementById('tool-dock');
      container.innerHTML = '';
      const buildButton = (tool) => {
        const button = document.createElement('button');
        button.className = 'tool-button';
        if (tool === 'mission_list') {
          button.classList.add('is-utility');
        }
        if (tool === 'archive') {
          button.classList.add('is-utility');
        }
        if (tool === 'send') {
          button.classList.add('is-send');
        }
        if (tool === 'clear') {
          button.classList.add('is-danger');
        }
        button.dataset.tool = tool;
        button.innerHTML = iconSvg(tool);
        button.addEventListener('click', () => {
          if (tool === 'mission_list') {
            openMissionDialog();
            return;
          }
          if (tool === 'archive') {
            emitAction({ type: 'storage_request', action: 'archive' });
            return;
          }
          if (tool === 'send') {
            emitAction({ type: 'mission_send_request' });
            return;
          }
          if (tool === 'clear') {
            clearAllLocal();
            emitAction({ type: 'tool_changed', tool: 'clear' });
            return;
          }
          window.kuzeyMap.setActiveTool(tool);
          emitAction({ type: 'tool_changed', tool });
        });
        return button;
      };

      [
        ['tool-group', PRIMARY_TOOLS],
        ['tool-group is-transfer', TRANSFER_TOOLS],
      ].forEach(([className, tools]) => {
        const group = document.createElement('div');
        group.className = className;
        tools.forEach((tool) => group.appendChild(buildButton(tool)));
        container.appendChild(group);
      });
      syncToolState();
      setToolbarTitles();
    }

    function syncToolState() {
      document.querySelectorAll('#tool-dock .tool-button').forEach((button) => {
        button.classList.toggle('active', button.dataset.tool === state.activeTool);
      });
    }

    function syncLayerState() {
      document.querySelectorAll('#layer-toggle button').forEach((button) => {
        button.classList.toggle('active', button.dataset.layer === state.currentLayer);
      });
    }

    function emitAction(payload) {
      if (bridge && bridge.mapAction) {
        bridge.mapAction(JSON.stringify(payload));
      }
    }

    function normalizeType(type) {
      const mapTypes = {
        polyline: 'route',
        polygon: 'survey',
        circle: 'target',
      };
      return mapTypes[type] || type;
    }

    function colorFor(type) {
      return COLORS[normalizeType(type)] || '#61a8ff';
    }

    function radiusFor(type) {
      return state.defaultRadii[normalizeType(type)] || DEFAULT_RADII[normalizeType(type)] || 35;
    }

    function inferLabel(type) {
      const normalized = normalizeType(type);
      const count = state.overlayOrder.filter((overlayId) => {
        const layer = state.layers.get(overlayId);
        return layer && layer.overlayData.overlay_type === normalized;
      }).length + 1;
      const labels = {
        takeoff: `TKF ${count}`,
        waypoint: `WP ${count}`,
        loiter: `LTR ${count}`,
        rally: `RLY ${count}`,
        route: `ROT ${count}`,
        survey: `ALN ${count}`,
        no_fly: `NFZ ${count}`,
        safe_zone: `SAFE ${count}`,
        hss: `HSS ${count}`,
        target: `HDF ${count}`,
        land: 'LND',
        goto: 'GOTO',
      };
      return labels[normalized] || normalized.toUpperCase();
    }

    function labelForPoint(type, order = null) {
      const normalized = normalizeType(type);
      const routeLabels = {
        takeoff: 'TKF',
        waypoint: 'WP',
        loiter: 'LTR',
        land: 'LND',
      };
      if (ROUTE_TYPES.has(normalized)) {
        return `${routeLabels[normalized] || normalized.toUpperCase()} ${order || routeLayers().length + 1}`;
      }
      if (normalized === 'hss') {
        return `HSS ${freeLayers().filter((layer) => layer.overlayData.overlay_type === 'hss').length + 1}`;
      }
      return inferLabel(normalized);
    }

    function styleFor(type, selected) {
      const normalized = normalizeType(type);
      const base = {
        color: colorFor(normalized),
        opacity: 0.96,
        fillColor: colorFor(normalized),
        fillOpacity: 0.0,
        weight: selected ? 3.4 : 2.2,
      };
      if (normalized === 'route') {
        return { ...base, dashArray: '8 5', weight: selected ? 3.2 : 2.5, fillOpacity: 0.0 };
      }
      if (normalized === 'survey') {
        return { ...base, fillOpacity: selected ? 0.12 : 0.06 };
      }
      if (normalized === 'no_fly') {
        return { ...base, fillOpacity: selected ? 0.12 : 0.07, dashArray: '10 5' };
      }
      if (normalized === 'safe_zone') {
        return { ...base, color: '#73d06b', fillOpacity: 0.0, dashArray: '12 4', weight: selected ? 3.2 : 2.4 };
      }
      if (normalized === 'hss') {
        return { ...base, fillOpacity: selected ? 0.12 : 0.06, dashArray: '2 4', weight: selected ? 3.0 : 2.2 };
      }
      if (normalized === 'loiter') {
        return { ...base, fillOpacity: selected ? 0.10 : 0.04, dashArray: '4 4' };
      }
      if (normalized === 'target') {
        return { ...base, fillOpacity: selected ? 0.10 : 0.05, dashArray: '2 5' };
      }
      return base;
    }

    function markerIcon(type, selected) {
      const color = colorFor(type);
      const cls = selected ? 'marker-icon selected' : 'marker-icon';
      return L.divIcon({
        className: 'map-marker-wrap',
        html: `<div class="${cls}" style="--marker-color:${color}">${iconSvg(type)}</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
      });
    }

    function aircraftSvg() {
      return '<svg viewBox="0 0 40 40"><path class="airframe" d="M20 4.5 30.2 34.5 20 29.2 9.8 34.5z"/><path class="spine" d="M20 9.5v18.8"/><path class="wing" d="M14.6 23.8 20 18.7l5.4 5.1"/><path class="wing" d="M16.5 31.4 20 28.2l3.5 3.2"/></svg>';
    }

    function contactColor(data) {
      const id = String(data.contact_id || '').toLowerCase();
      const source = String(data.source || '').toLowerCase();
      return id.includes('own') || source === 'ownship' ? '#58a6ff' : '#e05d5d';
    }

    function contactIcon(data) {
      const color = contactColor(data);
      return L.divIcon({
        className: 'contact-marker-wrap',
        html: `<div class="aircraft-icon" style="--aircraft-color:${color};transform:rotate(${data.heading || 0}deg)">${aircraftSvg()}</div>`,
        iconSize: [31, 31],
        iconAnchor: [15, 15],
      });
    }

    function labelPositionForLayer(layer) {
      if (layer instanceof L.Marker || layer instanceof L.Circle) {
        return layer.getLatLng();
      }
      if (layer instanceof L.Polygon) {
        return layer.getBounds().getCenter();
      }
      const latlngs = layer.getLatLngs();
      const points = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
      return points[Math.floor(points.length / 2)] || null;
    }

    function updateLabel(layer, selected) {
      const id = layer.overlayData.overlay_id;
      const position = labelPositionForLayer(layer);
      if (!position) {
        return;
      }
      const color = colorFor(layer.overlayData.overlay_type);
      const html = `<div class="overlay-label ${selected ? 'selected' : ''}" style="--label-color:${color}">${layer.overlayData.label}</div>`;
      let marker = state.labelLayers.get(id);
      if (!marker) {
        marker = L.marker(position, {
          interactive: true,
          draggable: POINT_TYPES.has(layer.overlayData.overlay_type),
          bubblingMouseEvents: false,
          icon: L.divIcon({ className: 'overlay-label-wrap', html }),
        });
        labelGroup.addLayer(marker);
        state.labelLayers.set(id, marker);
        registerLabelEvents(marker, layer);
      } else {
        marker.setLatLng(position);
        marker.setIcon(L.divIcon({ className: 'overlay-label-wrap', html }));
        if (marker.dragging) {
          if (POINT_TYPES.has(layer.overlayData.overlay_type)) {
            marker.dragging.enable();
          } else {
            marker.dragging.disable();
          }
        }
      }
    }

    function registerLabelEvents(marker, layer) {
      marker.on('mousedown', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        selectOverlay(layer.overlayData.overlay_id);
      });

      marker.on('click', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        if (state.draggingPoint || state.dragMoved || state.suppressPointClick) {
          return;
        }
        selectOverlay(layer.overlayData.overlay_id);
        if (POINT_TYPES.has(layer.overlayData.overlay_type)) {
          openPointDialog(layer.overlayData.overlay_id);
        }
      });

      marker.on('dragstart', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        hideDialogs();
        state.draggingPoint = layer.overlayData.overlay_id;
        state.dragMoved = false;
        selectOverlay(layer.overlayData.overlay_id);
      });

      marker.on('drag', () => {
        if (!POINT_TYPES.has(layer.overlayData.overlay_type)) {
          return;
        }
        state.dragMoved = true;
        layer.setLatLng(marker.getLatLng());
        refreshMissionRoute();
      });

      marker.on('dragend', () => {
        if (POINT_TYPES.has(layer.overlayData.overlay_type)) {
          layer.setLatLng(marker.getLatLng());
          updateLabel(layer, true);
          refreshMissionRoute();
          emitOverlay(layer);
        }
        if (state.dragMoved) {
          state.suppressPointClick = true;
          window.setTimeout(() => {
            state.suppressPointClick = false;
          }, 180);
        }
        state.draggingPoint = null;
        state.dragMoved = false;
      });
    }

    function polygonPoints(layer) {
      const latlngs = layer.getLatLngs();
      const first = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
      return first.map((point) => [point.lat, point.lng]);
    }

    function updateSafeMask(layer) {
      if (layer.overlayData.overlay_type !== 'safe_zone') {
        refreshSafeMask();
        return;
      }
      refreshSafeMask();
    }

    function refreshSafeMask() {
      if (!safeMaskGroup) {
        return;
      }
      safeMaskGroup.clearLayers();
      state.safeMasks.clear();
      const outer = [[-85, -180], [-85, 180], [85, 180], [85, -180]];
      const holes = [];
      state.layers.forEach((candidate) => {
        if (candidate.overlayData.overlay_type === 'safe_zone') {
          const points = polygonPoints(candidate);
          if (points.length >= 3) {
            holes.push(points);
          }
        }
      });
      if (!holes.length) {
        return;
      }
      const options = {
        color: '#eb6464',
        weight: 0,
        opacity: 0,
        fillColor: '#eb6464',
        fillOpacity: 0.10,
        fillRule: 'evenodd',
        interactive: false,
      };
      const mask = L.polygon([outer, ...holes], options);
      safeMaskGroup.addLayer(mask);
      state.safeMasks.set('combined', mask);
    }

    function removeSafeMask(id) {
      void id;
      refreshSafeMask();
    }

    function removeLabel(id) {
      if (!state.labelLayers.has(id)) {
        return;
      }
      labelGroup.removeLayer(state.labelLayers.get(id));
      state.labelLayers.delete(id);
    }

    function serializePoints(layer) {
      if (layer instanceof L.Marker) {
        const point = layer.getLatLng();
        return [[point.lat, point.lng]];
      }
      if (layer instanceof L.Circle) {
        const center = layer.getLatLng();
        return [[center.lat, center.lng]];
      }
      const latLngs = layer.getLatLngs();
      const first = Array.isArray(latLngs[0]) ? latLngs[0] : latLngs;
      return first.map((point) => [point.lat, point.lng]);
    }

    function serializeLayer(layer) {
      return {
        overlay_id: layer.overlayData.overlay_id,
        overlay_type: layer.overlayData.overlay_type,
        label: layer.overlayData.label,
        points: serializePoints(layer),
        radius_m: layer instanceof L.Circle ? layer.getRadius() : null,
        color: layer.overlayData.color,
        metadata: layer.overlayData.metadata || {},
      };
    }

    function emitOverlay(layer) {
      if (bridge && bridge.overlayChanged) {
        bridge.overlayChanged(JSON.stringify(serializeLayer(layer)));
      }
    }

    function layerCenter(layer) {
      const center = labelPositionForLayer(layer);
      if (!center) {
        return { lat: 0, lon: 0 };
      }
      return { lat: center.lat, lon: center.lng };
    }

    function emitMissionItem(layer) {
      const center = layerCenter(layer);
      emitAction({
        type: 'mission_item_created',
        item_type: layer.overlayData.overlay_type,
        lat: center.lat,
        lon: center.lon,
        radius_m: layer instanceof L.Circle ? layer.getRadius() : 0,
      });
    }

    function disableEditing(layer) {
      if (layer && layer.disableEdit) {
        layer.disableEdit();
      }
    }

    function enableEditing(layer) {
      if (layer && layer.enableEdit && !(layer instanceof L.Marker)) {
        layer.enableEdit(map);
      }
    }

    function syncMissionStats() {
      document.querySelector('#mission-chip strong').textContent = String(routeLayers().length);
      document.querySelector('#selection-chip strong').textContent = state.selectedId ? state.selectedId.slice(0, 8).toUpperCase() : '--';
    }

    function selectOverlay(id) {
      if (state.selectedId && state.layers.has(state.selectedId)) {
        const previous = state.layers.get(state.selectedId);
        disableEditing(previous);
        setLayerVisual(previous, false);
      }
      state.selectedId = id || null;
      if (state.selectedId && state.layers.has(state.selectedId)) {
        const current = state.layers.get(state.selectedId);
        enableEditing(current);
        setLayerVisual(current, true);
      }
      syncMissionStats();
      if (bridge && bridge.overlaySelected) {
        bridge.overlaySelected(state.selectedId || '');
      }
    }

    function setLayerVisual(layer, selected) {
      if (layer instanceof L.Marker) {
        layer.setIcon(markerIcon(layer.overlayData.overlay_type, selected));
      } else {
        layer.setStyle(styleFor(layer.overlayData.overlay_type, selected));
      }
      updateSafeMask(layer);
      updateLabel(layer, selected);
    }

    function mergeUniquePoints(points) {
      const merged = [];
      (points || []).forEach((point) => {
        const normalized = Array.isArray(point) ? point : [point.lat, point.lng];
        if (!merged.length || merged[merged.length - 1][0] !== normalized[0] || merged[merged.length - 1][1] !== normalized[1]) {
          merged.push(normalized);
        }
      });
      return merged;
    }

    function orderedOverlayIds() {
      const known = state.overlayOrder.filter((overlayId) => state.layers.has(overlayId));
      state.layers.forEach((_, overlayId) => {
        if (!known.includes(overlayId)) {
          known.push(overlayId);
        }
      });
      return known;
    }

    function refreshMissionRoute() {
      const routePoints = [];
      routeLayers()
        .forEach((layer) => {
          const center = layerCenter(layer);
          routePoints.push([center.lat, center.lon]);
      });
      missionRouteLine.setLatLngs(mergeUniquePoints(routePoints));
    }

    function routeOrderFor(layer) {
      return Number(layer.overlayData.metadata?.route_order || 999);
    }

    function routeLayers() {
      return orderedOverlayIds()
        .map((overlayId) => state.layers.get(overlayId))
        .filter((layer) => layer && ROUTE_TYPES.has(layer.overlayData.overlay_type))
        .sort((a, b) => routeOrderFor(a) - routeOrderFor(b));
    }

    function freeLayers() {
      return orderedOverlayIds()
        .map((overlayId) => state.layers.get(overlayId))
        .filter((layer) => layer && !ROUTE_TYPES.has(layer.overlayData.overlay_type));
    }

    function registerLayerEvents(layer) {
      layer.on('mousedown', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        if (state.activeTool === 'pan' && POINT_TYPES.has(layer.overlayData.overlay_type)) {
          beginPointDrag(layer, event);
        }
      });

      layer.on('click', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        if (state.draggingPoint || state.dragMoved || state.suppressPointClick) {
          state.dragMoved = false;
          return;
        }
        selectOverlay(layer.overlayData.overlay_id);
        if (POINT_TYPES.has(layer.overlayData.overlay_type)) {
          openPointDialog(layer.overlayData.overlay_id);
        }
      });

      layer.on('contextmenu', (event) => {
        L.DomEvent.stop(event.originalEvent || event);
        selectOverlay(layer.overlayData.overlay_id);
        showContextMenu(event.containerPoint, event.latlng);
      });

      if (layer instanceof L.Marker && layer.dragging) {
        layer.on('dragend', () => {
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
      }

      if (!(layer instanceof L.Marker)) {
        layer.on('editable:vertex:dragend', () => {
          updateSafeMask(layer);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
        layer.on('editable:dragend', () => {
          updateSafeMask(layer);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
        layer.on('editable:vertex:deleted', () => {
          updateSafeMask(layer);
          updateLabel(layer, state.selectedId === layer.overlayData.overlay_id);
          refreshMissionRoute();
          emitOverlay(layer);
        });
      }
    }

    function beginPointDrag(layer, event) {
      L.DomEvent.stop(event.originalEvent || event);
      selectOverlay(layer.overlayData.overlay_id);
      hideDialogs();
      state.draggingPoint = layer.overlayData.overlay_id;
      state.dragMoved = false;
      if (map.dragging) {
        map.dragging.disable();
      }
      const move = (moveEvent) => {
        if (!state.draggingPoint || !state.layers.has(state.draggingPoint)) {
          return;
        }
        const current = state.layers.get(state.draggingPoint);
        if (current instanceof L.Circle) {
          state.dragMoved = true;
          current.setLatLng(moveEvent.latlng);
          updateLabel(current, true);
          refreshMissionRoute();
        }
      };
      const finish = () => {
        map.off('mousemove', move);
        document.removeEventListener('mouseup', finish);
        const current = state.layers.get(state.draggingPoint);
        if (current) {
          updateLabel(current, true);
          refreshMissionRoute();
          emitOverlay(current);
        }
        if (state.dragMoved) {
          state.suppressPointClick = true;
          window.setTimeout(() => {
            state.suppressPointClick = false;
          }, 180);
        }
        state.draggingPoint = null;
        state.dragMoved = false;
        if (map.dragging) {
          map.dragging.enable();
        }
      };
      map.on('mousemove', move);
      document.addEventListener('mouseup', finish, { once: true });
    }

    function attachLayer(layer, orderIndex = null) {
      overlayGroup.addLayer(layer);
      state.layers.set(layer.overlayData.overlay_id, layer);
      if (orderIndex === null || orderIndex < 0 || orderIndex > state.overlayOrder.length) {
        if (!state.overlayOrder.includes(layer.overlayData.overlay_id)) {
          state.overlayOrder.push(layer.overlayData.overlay_id);
        }
      } else if (!state.overlayOrder.includes(layer.overlayData.overlay_id)) {
        state.overlayOrder.splice(orderIndex, 0, layer.overlayData.overlay_id);
      }
      setLayerVisual(layer, state.selectedId === layer.overlayData.overlay_id);
      registerLayerEvents(layer);
      refreshMissionRoute();
      syncMissionStats();
    }

    function createLayerFromData(data) {
      const type = normalizeType(data.overlay_type);
      const points = data.points || [];
      let layer = null;
      if (POINT_TYPES.has(type)) {
        layer = L.circle(points[0], {
          ...styleFor(type, false),
          radius: data.radius_m || radiusFor(type),
        });
      } else if (type === 'route') {
        layer = L.polyline(points, styleFor(type, false));
      } else {
        layer = L.polygon(points, styleFor(type, false));
      }
      layer.overlayData = {
        overlay_id: data.overlay_id,
        overlay_type: type,
        label: data.label || inferLabel(type),
        color: data.color || colorFor(type),
        metadata: data.metadata || {},
      };
      return layer;
    }

    function removeOverlayById(id, shouldNotify = true) {
      if (!state.layers.has(id)) {
        return;
      }
      const layer = state.layers.get(id);
      overlayGroup.removeLayer(layer);
      state.layers.delete(id);
      state.overlayOrder = state.overlayOrder.filter((overlayId) => overlayId !== id);
      removeLabel(id);
      removeSafeMask(id);
      if (state.selectedId === id) {
        state.selectedId = null;
      }
      if (shouldNotify && bridge && bridge.overlayRemoved) {
        bridge.overlayRemoved(id);
      }
      refreshMissionRoute();
      syncMissionStats();
    }

    function upsertOverlay(data) {
      const overlayId = data.overlay_id;
      const existingIndex = state.overlayOrder.indexOf(overlayId);
      const wasSelected = state.selectedId === overlayId;
      if (state.layers.has(overlayId)) {
        removeOverlayById(overlayId, false);
      }
      const layer = createLayerFromData(data);
      attachLayer(layer, existingIndex >= 0 ? existingIndex : state.overlayOrder.length);
      if (wasSelected) {
        selectOverlay(overlayId);
      }
    }

    function setOverlayOrder(order) {
      const unique = [];
      (order || []).forEach((overlayId) => {
        if (state.layers.has(overlayId) && !unique.includes(overlayId)) {
          unique.push(overlayId);
        }
      });
      state.layers.forEach((_, overlayId) => {
        if (!unique.includes(overlayId)) {
          unique.push(overlayId);
        }
      });
      state.overlayOrder = unique;
      refreshMissionRoute();
      syncMissionStats();
    }

    function finishNewLayer(layer, type) {
      const normalized = normalizeType(type);
      const nextRouteOrder = ROUTE_TYPES.has(normalized) ? routeLayers().length + 1 : null;
      layer.overlayData = {
        overlay_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        overlay_type: normalized,
        label: POINT_TYPES.has(normalized) ? labelForPoint(normalized, nextRouteOrder) : inferLabel(normalized),
        color: colorFor(normalized),
        metadata: {
          route_order: nextRouteOrder,
          independent: !ROUTE_TYPES.has(normalized),
          keep_inside: normalized === 'safe_zone',
        },
      };
      attachLayer(layer);
      selectOverlay(layer.overlayData.overlay_id);
      emitOverlay(layer);
      emitMissionItem(layer);
      if (normalized === 'safe_zone' || normalized === 'no_fly') {
        window.setTimeout(() => startShapeTool(normalized), 0);
      }
    }

    function addPointOverlay(type, latlng) {
      const normalized = normalizeType(type);
      const layer = L.circle(latlng, {
        ...styleFor(normalized, false),
        radius: radiusFor(normalized),
      });
      finishNewLayer(layer, normalized);
      if (normalized === 'land') {
        emitAction({ type: 'land_request', lat: latlng.lat, lon: latlng.lng });
      }
      if (normalized === 'takeoff') {
        emitAction({ type: 'takeoff_request', lat: latlng.lat, lon: latlng.lng });
      }
    }

    function addGotoCommand(latlng) {
      emitAction({ type: 'goto_request', lat: latlng.lat, lon: latlng.lng });
      const marker = L.circleMarker(latlng, {
        radius: 7,
        color: colorFor('goto'),
        fillColor: colorFor('goto'),
        fillOpacity: 0.35,
        weight: 2,
      }).addTo(overlayGroup);
      setTimeout(() => {
        overlayGroup.removeLayer(marker);
      }, 6000);
    }

    function startShapeTool(tool) {
      map.editTools.stopDrawing();
      const normalized = normalizeType(tool);
      if (normalized === 'safe_zone' || normalized === 'no_fly') {
        map.editTools.startPolygon(undefined, styleFor(normalized, false));
      }
    }

    function hideContextMenu() {
      document.getElementById('context-menu').style.display = 'none';
    }

    function showContextMenu(containerPoint, latlng) {
      contextPoint = latlng;
      const menu = document.getElementById('context-menu');
      menu.style.left = `${containerPoint.x}px`;
      menu.style.top = `${containerPoint.y}px`;
      menu.style.display = 'block';
      menu.querySelector('[data-action="delete"]').style.display = state.selectedId ? 'flex' : 'none';
    }

    function emitBounds() {
      const center = map.getCenter();
      const bounds = map.getBounds();
      document.querySelector('#zoom-readout strong').textContent = String(map.getZoom());
      if (bridge && bridge.boundsChanged) {
        bridge.boundsChanged(JSON.stringify({
          center: { lat: center.lat, lng: center.lng },
          northEast: bounds.getNorthEast(),
          southWest: bounds.getSouthWest(),
          layer: state.currentLayer,
          zoom: map.getZoom(),
        }));
      }
    }

    function updateCursor(latlng) {
      const signature = `${latlng.lat.toFixed(5)}:${latlng.lng.toFixed(5)}`;
      if (state.lastCursor === signature) {
        return;
      }
      state.lastCursor = signature;
      document.querySelector('#cursor-readout').innerHTML = `LAT <strong>${latlng.lat.toFixed(5)}</strong> LON <strong>${latlng.lng.toFixed(5)}</strong>`;
    }

    function queueCursorUpdate(latlng) {
      state.pendingCursor = latlng;
      if (state.cursorFrame) {
        return;
      }
      state.cursorFrame = window.requestAnimationFrame(() => {
        state.cursorFrame = 0;
        if (state.pendingCursor) {
          updateCursor(state.pendingCursor);
        }
      });
    }

    function notifyTileProblem(name) {
      if (state.tileNotified[name]) {
        return;
      }
      state.tileNotified[name] = true;
      emitAction({
        type: 'tile_notice',
        message: name === 'satellite'
          ? 'Uydu katmaninda bazi tile istekleri yuklenemedi'
          : 'Vektorel katmanda bazi tile istekleri yuklenemedi',
      });
    }

    function buildTileLayer(url, name, options = {}) {
      const layer = L.tileLayer(url, {
        minZoom: 3,
        maxZoom: 21,
        maxNativeZoom: 20,
        crossOrigin: false,
        updateWhenIdle: true,
        updateWhenZooming: false,
        keepBuffer: 1,
        detectRetina: false,
        errorTileUrl: BLANK_TILE,
        ...options,
      });
      layer.on('tileerror', () => notifyTileProblem(name));
      return layer;
    }

    function proxyTileUrl(provider, variant, extension = 'png') {
      const baseUrl = (state.tileCache.baseUrl || '').replace(/\/$/, '');
      if (!baseUrl || state.tileCache.enabled === false) {
        return null;
      }
      return `${baseUrl}/tile/${provider}/${variant}/{z}/{x}/{y}.${extension}`;
    }

    function remoteCartoUrl(style) {
      return `https://{s}.basemaps.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`;
    }

    function vectorTileOptions(tileClass) {
      const options = {
        maxNativeZoom: 20,
        maxZoom: 21,
        className: `vector-base-tiles ${tileClass}`,
      };
      if (!state.tileCache.baseUrl) {
        options.subdomains = 'abcd';
      }
      return options;
    }

    function createVectorLayer(themeName) {
      const lightMode = themeName === 'light';
      const baseStyle = lightMode ? 'light_nolabels' : 'dark_nolabels';
      const labelStyle = lightMode ? 'light_only_labels' : 'dark_only_labels';
      const tileClass = lightMode ? 'vector-light' : 'vector-dark';
      const baseUrl = proxyTileUrl('carto', baseStyle) || remoteCartoUrl(baseStyle);
      const labelUrl = proxyTileUrl('carto', labelStyle) || remoteCartoUrl(labelStyle);
      return L.layerGroup([
        buildTileLayer(
          baseUrl,
          'vector',
          vectorTileOptions(tileClass)
        ),
        buildTileLayer(
          labelUrl,
          'vector',
          {
            maxNativeZoom: 20,
            maxZoom: 21,
            className: `vector-label-tiles ${tileClass}`,
            ...(state.tileCache.baseUrl ? {} : { subdomains: 'abcd' }),
          }
        ),
      ]);
    }

    function createSatelliteLayer() {
      return buildTileLayer(
        proxyTileUrl('esri', 'world-imagery', 'jpg') ||
          'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        'satellite',
        { maxNativeZoom: 19, maxZoom: 21 }
      );
    }

    function rebuildVectorLayer(themeName) {
      const shouldShowVector = !satelliteLayer || state.currentLayer === 'vector' || map.hasLayer(vectorLayer);
      if (vectorLayer && map.hasLayer(vectorLayer)) {
        map.removeLayer(vectorLayer);
      }
      vectorLayer = createVectorLayer(themeName);
      if (shouldShowVector && state.currentLayer !== 'satellite') {
        vectorLayer.addTo(map);
      }
    }

    function rebuildSatelliteLayer() {
      const shouldShowSatellite = satelliteLayer && (state.currentLayer === 'satellite' || map.hasLayer(satelliteLayer));
      if (satelliteLayer && map.hasLayer(satelliteLayer)) {
        map.removeLayer(satelliteLayer);
      }
      satelliteLayer = createSatelliteLayer();
      if (shouldShowSatellite) {
        satelliteLayer.addTo(map);
      }
    }

    function trimTrail(points, limit = 40) {
      const normalized = mergeUniquePoints(points);
      return normalized.slice(-limit);
    }

    function upsertContact(data) {
      if (!data || !data.contact_id) {
        return;
      }
      const latlng = [data.latitude, data.longitude];
      const trailPoints = trimTrail((data.trail_points || []).concat([latlng]), state.contactTrailLimit);
      let entry = state.contacts.get(data.contact_id);
      if (!entry) {
        const marker = L.marker(latlng, {
          interactive: false,
          icon: contactIcon(data),
        });
        marker.bindTooltip(data.label || data.contact_id, { direction: 'top', opacity: 0.92 });
        const trail = L.polyline(trailPoints, {
          color: contactColor(data),
          weight: 2,
          opacity: 0.35,
          lineCap: 'round',
          lineJoin: 'round',
        });
        contactGroup.addLayer(trail);
        contactGroup.addLayer(marker);
        entry = { marker, trail };
        state.contacts.set(data.contact_id, entry);
      } else {
        entry.marker.setLatLng(latlng);
        entry.marker.setIcon(contactIcon(data));
        entry.marker.setTooltipContent(data.label || data.contact_id);
        entry.trail.setStyle({ color: contactColor(data) });
        entry.trail.setLatLngs(trailPoints);
      }
    }

    function ownVehicleLatLng() {
      if (vehicleMarker && map.hasLayer(vehicleMarker)) {
        return vehicleMarker.getLatLng();
      }
      const own = state.contacts.get('own-siha');
      if (own) {
        return own.marker.getLatLng();
      }
      return null;
    }

    function removeContact(contactId) {
      if (!state.contacts.has(contactId)) {
        return;
      }
      const entry = state.contacts.get(contactId);
      contactGroup.removeLayer(entry.marker);
      contactGroup.removeLayer(entry.trail);
      state.contacts.delete(contactId);
    }

    function ensureVehicleLayers() {
      if (contactGroup && !map.hasLayer(contactGroup)) {
        contactGroup.addTo(map);
      }
      state.contacts.forEach((entry) => {
        if (entry.trail && !contactGroup.hasLayer(entry.trail)) {
          contactGroup.addLayer(entry.trail);
        }
        if (entry.marker && !contactGroup.hasLayer(entry.marker)) {
          contactGroup.addLayer(entry.marker);
        }
      });
      if (trailLine && !map.hasLayer(trailLine)) {
        trailLine.addTo(map);
      }
    }

    function hideDialogs() {
      document.getElementById('point-dialog').style.display = 'none';
      document.getElementById('mission-dialog').style.display = 'none';
    }

    function typeOptions(types, current) {
      return types.map((type) => {
        const label = state.ui.tools[type] || TOOL_DEFAULTS[type] || type.toUpperCase();
        return `<option value="${type}" ${type === current ? 'selected' : ''}>${label}</option>`;
      }).join('');
    }

    function openPointDialog(overlayId) {
      const layer = state.layers.get(overlayId);
      if (!layer || !POINT_TYPES.has(layer.overlayData.overlay_type)) {
        return;
      }
      const dialog = document.getElementById('point-dialog');
      const typeInput = document.getElementById('point-type-input');
      const radiusInput = document.getElementById('point-radius-input');
      const orderInput = document.getElementById('point-order-input');
      typeInput.innerHTML = typeOptions(EDITABLE_POINT_TYPES, layer.overlayData.overlay_type);
      radiusInput.value = Math.round(layer instanceof L.Circle ? layer.getRadius() : radiusFor(layer.overlayData.overlay_type));
      orderInput.value = layer.overlayData.metadata?.route_order || routeLayers().length + 1;
      orderInput.disabled = !ROUTE_TYPES.has(layer.overlayData.overlay_type);
      dialog.dataset.overlayId = overlayId;
      dialog.style.left = '14px';
      dialog.style.top = '94px';
      dialog.style.display = 'block';
    }

    function applyPointDialog() {
      const dialog = document.getElementById('point-dialog');
      const layer = state.layers.get(dialog.dataset.overlayId);
      if (!layer) {
        return;
      }
      const nextType = document.getElementById('point-type-input').value;
      const nextRadius = Number(document.getElementById('point-radius-input').value || radiusFor(nextType));
      const nextOrder = Number(document.getElementById('point-order-input').value || routeLayers().length + 1);
      layer.overlayData.overlay_type = nextType;
      layer.overlayData.color = colorFor(nextType);
      layer.overlayData.label = labelForPoint(nextType, nextOrder);
      layer.overlayData.metadata = {
        ...(layer.overlayData.metadata || {}),
        route_order: ROUTE_TYPES.has(nextType) ? nextOrder : null,
        independent: !ROUTE_TYPES.has(nextType),
      };
      if (layer instanceof L.Circle) {
        layer.setRadius(nextRadius);
      }
      setLayerVisual(layer, state.selectedId === layer.overlayData.overlay_id);
      refreshMissionRoute();
      emitOverlay(layer);
      hideDialogs();
    }

    function renderPointRows(containerId, layers, routeRows) {
      const container = document.getElementById(containerId);
      if (!layers.length) {
        container.innerHTML = '<div class="stat-chip">BOS <strong>--</strong></div>';
        return;
      }
      container.innerHTML = layers.map((layer, index) => {
        const type = layer.overlayData.overlay_type;
        const radius = layer instanceof L.Circle ? Math.round(layer.getRadius()) : '';
        const order = routeRows ? (layer.overlayData.metadata?.route_order || index + 1) : '';
        const choices = routeRows
          ? typeOptions(['takeoff', 'waypoint', 'loiter', 'land'], type)
          : typeOptions(layer instanceof L.Circle ? ['hss'] : ['no_fly', 'safe_zone'], type);
        return `
          <div class="point-list-row" data-overlay-id="${layer.overlayData.overlay_id}">
            <strong>${routeRows ? order : '--'}</strong>
            <select data-field="type">${choices}</select>
            <input data-field="radius" type="number" min="5" max="1000" value="${radius}" ${layer instanceof L.Circle ? '' : 'disabled'}>
            <input data-field="order" type="number" min="1" max="999" value="${order}" ${routeRows ? '' : 'disabled'}>
          </div>
        `;
      }).join('');
    }

    function openMissionDialog() {
      renderPointRows('route-point-list', routeLayers(), true);
      renderPointRows('free-point-list', freeLayers(), false);
      const dialog = document.getElementById('mission-dialog');
      dialog.style.left = '14px';
      dialog.style.top = '94px';
      dialog.style.display = 'block';
    }

    function applyMissionDialog() {
      document.querySelectorAll('.point-list-row').forEach((row) => {
        const layer = state.layers.get(row.dataset.overlayId);
        if (!layer) {
          return;
        }
        const type = row.querySelector('[data-field="type"]').value;
        const radius = Number(row.querySelector('[data-field="radius"]').value || radiusFor(type));
        const orderInput = row.querySelector('[data-field="order"]');
        const order = Number(orderInput.value || 999);
        layer.overlayData.overlay_type = type;
        layer.overlayData.color = colorFor(type);
        layer.overlayData.label = POINT_TYPES.has(type) ? labelForPoint(type, order) : inferLabel(type);
        layer.overlayData.metadata = {
          ...(layer.overlayData.metadata || {}),
          route_order: ROUTE_TYPES.has(type) ? order : null,
          independent: !ROUTE_TYPES.has(type),
          keep_inside: type === 'safe_zone',
        };
        if (layer instanceof L.Circle) {
          layer.setRadius(radius);
        }
        setLayerVisual(layer, state.selectedId === layer.overlayData.overlay_id);
        emitOverlay(layer);
      });
      refreshMissionRoute();
      hideDialogs();
    }

    function clearAllLocal() {
      const vehicleWasVisible = vehicleMarker && map.hasLayer(vehicleMarker);
      map.editTools.stopDrawing();
      if (state.selectedId && state.layers.has(state.selectedId)) {
        disableEditing(state.layers.get(state.selectedId));
      }
      state.layers.forEach((layer) => {
        if (map.hasLayer(layer)) {
          map.removeLayer(layer);
        }
      });
      if (map.editTools && map.editTools.featuresLayer) {
        map.editTools.featuresLayer.clearLayers();
      }
      overlayGroup.clearLayers();
      safeMaskGroup.clearLayers();
      labelGroup.clearLayers();
      state.layers.clear();
      state.labelLayers.clear();
      state.safeMasks.clear();
      state.overlayOrder = [];
      state.selectedId = null;
      missionRouteLine.setLatLngs([]);
      hideDialogs();
      hideContextMenu();
      state.activeTool = 'pan';
      syncToolState();
      syncMissionStats();
      ensureVehicleLayers();
      if (vehicleWasVisible && vehicleMarker && !map.hasLayer(vehicleMarker)) {
        vehicleMarker.addTo(map);
      }
      if (bridge && bridge.overlaySelected) {
        bridge.overlaySelected('');
      }
    }

    function createVehicleMarker() {
      return L.marker([0, 0], {
        interactive: false,
        icon: L.divIcon({
          className: 'vehicle-icon',
          html: `<div class="aircraft-icon" style="--aircraft-color:var(--accent)">${aircraftSvg()}</div>`,
          iconSize: [31, 31],
          iconAnchor: [15, 15],
        }),
      });
    }

    function bindDialogEvents() {
      const pointDialog = document.getElementById('point-dialog');
      pointDialog.addEventListener('click', (event) => {
        const action = event.target.dataset.pointAction;
        if (!action) {
          return;
        }
        if (action === 'cancel') {
          hideDialogs();
        }
        if (action === 'apply') {
          applyPointDialog();
        }
      });

      document.getElementById('point-type-input').addEventListener('change', (event) => {
        const type = event.target.value;
        const orderInput = document.getElementById('point-order-input');
        const radiusInput = document.getElementById('point-radius-input');
        orderInput.disabled = !ROUTE_TYPES.has(type);
        if (!radiusInput.value) {
          radiusInput.value = radiusFor(type);
        }
      });

      const missionDialog = document.getElementById('mission-dialog');
      missionDialog.addEventListener('click', (event) => {
        const action = event.target.dataset.missionAction;
        const row = event.target.closest('.point-list-row');
        if (row && !action) {
          selectOverlay(row.dataset.overlayId);
        }
        if (!action) {
          return;
        }
        if (action === 'cancel') {
          hideDialogs();
        }
        if (action === 'apply') {
          applyMissionDialog();
        }
        if (action === 'clear') {
          clearAllLocal();
          emitAction({ type: 'tool_changed', tool: 'clear' });
        }
      });
    }

    function init() {
      map = L.map('map', {
        editable: true,
        zoomControl: false,
        doubleClickZoom: false,
        attributionControl: false,
        preferCanvas: true,
        renderer: L.canvas({ padding: 0.2 }),
        maxZoom: 21,
        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,
        inertia: false,
      }).setView([39.8672, 32.7481], 15);

      vectorLayer = createVectorLayer(state.themeName);
      satelliteLayer = createSatelliteLayer();
      if (state.currentLayer === 'satellite') {
        satelliteLayer.addTo(map);
      } else {
        vectorLayer.addTo(map);
      }

      safeMaskGroup = L.layerGroup().addTo(map);
      overlayGroup = L.featureGroup().addTo(map);
      missionRouteLine = L.polyline([], {
        color: '#95f089',
        weight: 2.4,
        opacity: 0.82,
        lineCap: 'round',
        lineJoin: 'round',
      }).addTo(map);
      labelGroup = L.layerGroup().addTo(map);
      contactGroup = L.layerGroup().addTo(map);
      trailLine = L.polyline([], {
        color: '#61a8ff',
        weight: 2.2,
        opacity: 0.56,
        lineCap: 'round',
        lineJoin: 'round',
      }).addTo(map);
      vehicleMarker = createVehicleMarker();
      L.control.scale({ imperial: false }).addTo(map);

      buildLayerToggle();
      buildToolDock();
      bindDialogEvents();

      map.on('mousemove', (event) => queueCursorUpdate(event.latlng));
      map.on('moveend', emitBounds);
      map.on('zoomend', emitBounds);

      map.on('click', (event) => {
        hideContextMenu();
        const tool = state.activeTool;
        if (tool === 'pan') {
          selectOverlay(null);
          return;
        }
        if (POINT_TYPES.has(tool)) {
          addPointOverlay(tool, event.latlng);
          return;
        }
      });

      map.on('contextmenu', (event) => {
        showContextMenu(event.containerPoint, event.latlng);
      });

      map.on('editable:drawing:commit', (event) => {
        const tool = normalizeType(state.activeTool);
        if (!event.layer || tool === 'pan') {
          return;
        }
        finishNewLayer(event.layer, tool);
      });

      document.body.addEventListener('click', (event) => {
        if (!event.target.closest('.context-menu')) {
          hideContextMenu();
        }
      });

      document.getElementById('context-menu').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        const action = button ? button.dataset.action : null;
        if (!action || !contextPoint) {
          hideContextMenu();
          return;
        }
        hideContextMenu();
        if (action === 'goto') {
          addGotoCommand(contextPoint);
        } else if (action === 'takeoff') {
          addPointOverlay('takeoff', contextPoint);
        } else if (action === 'waypoint') {
          addPointOverlay('waypoint', contextPoint);
        } else if (action === 'loiter') {
          addPointOverlay('loiter', contextPoint);
        } else if (action === 'land') {
          addPointOverlay('land', contextPoint);
        } else if (action === 'center') {
          const ownLatLng = ownVehicleLatLng();
          if (ownLatLng) {
            map.invalidateSize(false);
            map.setView(ownLatLng, Math.max(map.getZoom(), state.centerMinZoom), { animate: false });
            emitAction({ type: 'center_vehicle' });
          }
        } else if (action === 'delete' && state.selectedId) {
          removeOverlayById(state.selectedId, true);
        }
      });

      emitBounds();
    }

    window.kuzeyMap = {
      setUiConfig(config) {
        state.ui = {
          layers: config.layers || state.ui.layers,
          tools: config.tools || state.ui.tools,
          context: config.context || state.ui.context,
        };
        const previousTileBaseUrl = state.tileCache.baseUrl;
        state.tileCache = {
          ...state.tileCache,
          ...(config.tileCache || {}),
        };
        if (config.currentLayer) {
          state.currentLayer = config.currentLayer;
        }
        const defaults = config.missionDefaults || {};
        state.defaultRadii = { ...state.defaultRadii, ...(defaults.radii || {}) };
        state.centerMinZoom = Number(defaults.centerMinZoom || state.centerMinZoom);
        state.vehicleTrailLimit = Number(defaults.vehicleTrailLimit || state.vehicleTrailLimit);
        state.contactTrailLimit = Number(defaults.contactTrailLimit || state.contactTrailLimit);
        const theme = config.theme || {};
        const nextThemeName = theme.name || state.themeName;
        applyTheme(theme);
        const tileCacheChanged = map && previousTileBaseUrl !== state.tileCache.baseUrl;
        if (map && (nextThemeName !== state.themeName || tileCacheChanged)) {
          state.themeName = nextThemeName;
          rebuildVectorLayer(state.themeName);
          rebuildSatelliteLayer();
          syncLayerState();
          window.setTimeout(emitBounds, 0);
        } else {
          state.themeName = nextThemeName;
        }
        setToolbarTitles();
      },

      setBaseLayer(layer) {
        state.currentLayer = layer || 'vector';
        syncLayerState();
        if (state.currentLayer === 'satellite') {
          if (map.hasLayer(vectorLayer)) {
            map.removeLayer(vectorLayer);
          }
          if (!map.hasLayer(satelliteLayer)) {
            satelliteLayer.addTo(map);
          }
        } else {
          if (map.hasLayer(satelliteLayer)) {
            map.removeLayer(satelliteLayer);
          }
          if (!map.hasLayer(vectorLayer)) {
            vectorLayer.addTo(map);
          }
        }
        window.setTimeout(emitBounds, 0);
      },

      setActiveTool(tool) {
        state.activeTool = tool || 'pan';
        syncToolState();
        map.editTools.stopDrawing();
        if (['safe_zone', 'no_fly'].includes(state.activeTool)) {
          startShapeTool(state.activeTool);
        }
      },

      setOverlays(items) {
        orderedOverlayIds().forEach((overlayId) => removeOverlayById(overlayId, false));
        state.overlayOrder = [];
        (items || []).forEach((item) => upsertOverlay(item));
      },

      upsertOverlay(data) {
        upsertOverlay(data);
      },

      removeOverlayById(id, shouldNotify = false) {
        removeOverlayById(id, shouldNotify);
      },

      setOverlayOrder(order) {
        setOverlayOrder(order);
      },

      setSelectedOverlay(id) {
        selectOverlay(id || null);
      },

      setCacheCount(count) {
        document.querySelector('#cache-chip strong').textContent = String(count || 0);
      },

      upsertContact(data) {
        upsertContact(data);
      },

      removeContact(contactId) {
        removeContact(contactId);
      },

      clearAllLocal() {
        clearAllLocal();
      },

      pushTelemetry(payload) {
        if (!payload || !payload.active) {
          if (vehicleMarker && map.hasLayer(vehicleMarker)) {
            map.removeLayer(vehicleMarker);
          }
          trailLine.setLatLngs([]);
          state.initialCentered = false;
          return;
        }
        const latlng = [payload.lat, payload.lon];
        if (!map.hasLayer(vehicleMarker)) {
          vehicleMarker.addTo(map);
        }
        vehicleMarker.setLatLng(latlng);
        vehicleMarker.setIcon(L.divIcon({
          className: 'vehicle-icon',
          html: `<div class="aircraft-icon" style="--aircraft-color:var(--accent);transform:rotate(${payload.heading || 0}deg)">${aircraftSvg()}</div>`,
          iconSize: [31, 31],
          iconAnchor: [15, 15],
        }));
        trailLine.setLatLngs(trimTrail(trailLine.getLatLngs().concat([latlng]), state.vehicleTrailLimit));
        if (!state.initialCentered) {
          map.setView(latlng, Math.max(map.getZoom(), 15));
          state.initialCentered = true;
        }
      },
    };

    function bootMap(initialConfig) {
      if (initialConfig) {
        window.kuzeyMap.setUiConfig(initialConfig);
      }
      init();
      if (bridge && bridge.jsReady) {
        bridge.jsReady();
      }
    }

    new QWebChannel(qt.webChannelTransport, (channel) => {
      bridge = channel.objects.qtBridge;
      if (bridge && bridge.initialConfig) {
        bridge.initialConfig((payload) => {
          let config = null;
          try {
            config = payload ? JSON.parse(payload) : null;
          } catch (_error) {
            config = null;
          }
          bootMap(config);
        });
      } else {
        bootMap(null);
      }
    });
  </script>
</body>
</html>
