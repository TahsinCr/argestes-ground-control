name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and Core submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r extensions/mavlink/requirements.txt
          python -m pip install -r extensions/map_autonomy/requirements.txt

      - name: Run application and Core tests
        run: python run_tests.py
        env:
          QT_QPA_PLATFORM: offscreen
